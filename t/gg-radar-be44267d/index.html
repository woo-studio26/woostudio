<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>경기 입지 레이더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ac:#5b3fd6;--ac2:#efeafe;--bd:#e5e7eb;--mu:#6b7280;--bg:#f7f7f9;--red:#dc2626;--grn:#059669}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:#111827;background:#fff}
#app{position:fixed;inset:0;display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:8px 14px;border-bottom:1px solid var(--bd);background:#fff;z-index:5;overflow-x:auto}
.logo{font-weight:800;font-size:16px;white-space:nowrap;color:var(--ac)}
.logo small{display:block;font-weight:500;font-size:10.5px;color:var(--mu)}
.stat{white-space:nowrap}.stat b{display:block;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat span{font-size:10.5px;color:var(--mu)}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd);background:#fff;z-index:4}
.sbox{padding:10px 12px 6px}
.search{display:flex;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px;gap:6px}
.search input{border:0;background:transparent;flex:1;font-size:14px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;background:#fff}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 6px}
.tab{flex:1;text-align:center;padding:9px 0;font-size:13px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent}
.tab.on{color:#111;border-bottom-color:#111;font-weight:700}
#list{flex:1;overflow:auto}
.row{padding:10px 14px;border-bottom:1px solid #f1f1f4;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.row:hover{background:#fafaff}
.rn{font-weight:700;font-size:14px}.rs{font-size:11.5px;color:var(--mu)}
.sc{font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.d{font-size:11.5px;font-weight:700}.up{color:var(--red)}.dn{color:#2563eb}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:#f1f1f4;color:#374151;margin-right:3px}
.tag.r{background:#fee2e2;color:#b91c1c}.tag.p{background:var(--ac2);color:var(--ac)}.tag.g{background:#dcfce7;color:#166534}
.sortbar{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.sortbar select{font-size:12px;border:1px solid var(--bd);border-radius:6px;padding:3px}
.det{padding:12px 14px}
.back{font-size:12px;color:var(--ac);cursor:pointer;margin-bottom:6px}
.gauge{display:flex;align-items:center;gap:14px;margin:8px 0}
.bars .b{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:6px;font-size:12px;margin:4px 0}
.trk{height:7px;background:#eef;border-radius:4px;overflow:hidden}.fil{height:7px;background:var(--ac);border-radius:4px}
.sec{margin-top:14px}.sec h4{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 8px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--mu)}
.note{font-size:11px;color:var(--mu);line-height:1.5}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;margin:8px 0}
.btn{display:inline-block;border:1px solid var(--ac);color:var(--ac);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;margin-top:6px}
.news{padding:10px 14px;border-bottom:1px solid #f1f1f4;cursor:pointer}
.news:hover{background:#fafaff}
.nt{font-weight:700;font-size:13.5px;margin:3px 0;line-height:1.35}.ns{font-size:12px;color:#374151;line-height:1.5}
.news a{font-size:11px;color:var(--ac);text-decoration:none}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
.layers{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:5px}
.lb{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);min-width:52px}
.lb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.yearbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:500;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:10px 16px 8px;width:min(620px,92%)}
.yt{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:2px}
.yt b{font-size:18px;color:var(--ac)}
.yearbar input{width:100%;accent-color:var(--ac)}
.yl{display:flex;justify-content:space-between;font-size:10px;color:var(--mu)}
.sce{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.sce .chip{font-size:11px;padding:3px 8px}
.pin{position:relative;transform:translate(-50%,-100%);display:inline-block;white-space:nowrap;cursor:pointer}
.pin .box{background:var(--c);color:#fff;border-radius:7px;padding:3px 6px 3px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.15}
.pin .pt{font-size:10px;opacity:.9}.pin .pp{font-size:13px;font-weight:800}.pin .ps{font-size:10.5px;background:rgba(255,255,255,.22);border-radius:4px;margin-top:2px;padding:0 4px}
.pin:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c);border-bottom:0}
.pin.dim{opacity:.25}
.apin{position:relative;display:inline-block;transform:translate(-50%,-100%);white-space:nowrap;cursor:pointer}.apin .box{background:#fff;border:2px solid var(--c);border-radius:8px;padding:2px 7px 3px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.25);line-height:1.2}.apin .rk{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}.apin .pp{font-size:13px;font-weight:800;color:var(--c)}.apin .pt{font-size:9.5px;color:#6b7280}.apin:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c);border-bottom:0}.apin .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;font-size:10.5px;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.lead{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:center;padding:8px 6px;border-bottom:1px solid #f1f1f4;cursor:pointer;border-radius:6px}.lead:hover,.lead.on{background:#f6f3ff}.lead .r{width:22px;height:22px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dot{transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.dot.dim{opacity:.25}.dot.sel{outline:3px solid #111}.pin.sel .box{outline:3px solid #111}
.pin .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:7px;font-size:10.5px;font-weight:700;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.lt{background:#fff;border:1px solid #ddd;border-radius:4px;padding:1px 5px;font-size:10.5px;font-weight:700;box-shadow:none}
.lt:before{display:none}
.ico{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);border:2px solid #fff}
.leaflet-popup-content{font-size:12.5px;line-height:1.5;margin:10px 12px}
@media(max-width:860px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 52vh 1fr}
 header{grid-column:1}
 #mapwrap{grid-row:2}#side{grid-row:3;border-right:0;border-top:1px solid var(--bd)}
 .yearbar{bottom:6px;padding:6px 10px}.sce{display:none}
 .layers{top:6px;right:6px}.leaflet-control-zoom{display:none}.lb{padding:4px 6px;min-width:44px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="logo">경기 입지 레이더<small>제2의 판교·동탄 찾기 · <span id="upd"></span></small></div>
 <div class="stat"><b id="s1">-</b><span>점수 상위 (연도 기준)</span></div>
 <div class="stat"><b id="s2">-</b><span>최근 7일 새 소식</span></div>
 <div class="stat"><b id="s3">-</b><span>다음 청약</span></div>
 <div class="stat"><b id="s4">11/26 금통위</b><span>정책 변수 일정</span></div>
 <div class="stat"><b id="s5">-</b><span>내 매수 상한(증빙 전제)</span></div>
</header>
<aside id="side">
 <div class="sbox">
  <div class="search"><input id="q" placeholder="동네 검색 (예: 진안, 동탄, 지제)"></div>
  <div class="chips" id="pre"></div>
  <div class="chips" id="flt"></div>
 </div>
 <div class="tabs" id="tabs"></div>
 <div id="list"></div>
</aside>
<div id="mapwrap">
 <div id="map"></div>
 <div class="layers" id="layers"></div>
 <div class="yearbar">
  <div class="yt"><span>연도 <b id="yv">2026</b></span><span id="ymsg" class="note"></span></div>
  <input type="range" id="yr" min="2026" max="2036" step="1" value="2026">
  <div class="yl"><span>2026</span><span>2028</span><span>2030</span><span>2032</span><span>2034</span><span>2036</span></div>
  <div class="sce" id="sce"></div>
 </div>
</div>
</div>
<script>
const VKEY='5C8BA639-2724-45CB-8D7A-E275450C339C';
let D,M,map,Y=2026,SC=new Set(),tab='dong',sel=null,preset='all',F=new Set(),sizeKey='p59',sortKey='score',cmp=[],q='',base='base';
const LAY={rail:true,jobs:true,hosp:true,news:true,n3:false,subs:true};
const pinL={},lineL=[],hospL=[],anchL=[],newsL=[],n3L=[],subL=[];
const cl=x=>Math.max(0,Math.min(1,x));
const fmt=v=>v==null?'-':(v>=10?v.toFixed(1):v.toFixed(2)).replace(/\.?0+$/,'')+'억';
let HIST=null,hSize='p84',hPer=5,hApt=-2,pinMode='lead';
const short=o=>o.name.replace(/^(평택|처인|수원|기흥|화성|오산|용인|안성|성남|하남|남양주|고양|부천|인천|시흥|분당)\s/,'').split(/[·( ]/)[0];const RC=['#5b3fd6','#ea580c','#0f766e'],RN=['대장','2위','3위'];const aptL=[];
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{D=d;M=d.model;window.RADAR=d;init();fetch('history.json?v='+Date.now()).then(r=>r.json()).then(h=>{HIST=h;render()}).catch(()=>{})});

// ---------- 점수 엔진 ----------
function gangT(o,y){let T=o.t.gangnam;for(const r of M.rail){const yy=r.year+(SC.has('gtxDelay')&&r.line==='gtxa_ext'?2:0);if(r.ids[o.id]!=null&&y>=yy)T=Math.min(T,r.ids[o.id])}
 const s=M.scenarios.chip;if(SC.has('chip')&&s.ids[o.id]!=null&&y>=s.year)T=Math.min(T,s.ids[o.id]);return T}
function score(o,y){const W=M.weights,t=o.t;const T=gangT(o,y);const g=W.gangnam*cl((65-T)/50);
 let js=[];for(const a of D.anch){let w=0;for(const [yr,ww] of a.steps)if(y>=yr)w=ww;if(w&&t[a.id]!=null)js.push(w*cl((50-t[a.id])/40))}
 js.sort((a,b)=>b-a);const j=W.jobs*Math.min(1,(js[0]||0)+.25*(js[1]||0));
 let hs=[0];for(const h of D.hosp){if(h.open&&y<h.open)continue;if(SC.has('ajouCancel')&&h.id==='ajou_pt')continue;hs.push(h.w*cl((50-t[h.id])/35))}
 const hp=W.hosp*Math.max(...hs);
 let dv;if(M.dev[o.id]){const [a,b,m]=M.dev[o.id];dv=m*(.35+.65*cl((y-a)/(b-a)))}else dv=M.devFlat[o.id]??5;
 const sch=M.school[o.id]??4;let pen=0;for(const p of M.supplyPenalty)if(p.ids.includes(o.id)&&p.years.includes(y))pen+=p.p;
 const sup=10-pen;const cf=o.by==null?5:5*cl((o.by-1990)/32);
 const parts=[g,j,hp,dv,sch,sup,cf];return {s:parts.reduce((a,b)=>a+b,0),parts,T}}
let REG={a:0,b:0};
function fitModel(){const pts=D.dongs.filter(o=>o.p84&&o.n84>=10).map(o=>[score(o,2026).s,Math.log(o.p84)]);
 const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;
 const b=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/pts.reduce((a,p)=>a+(p[0]-mx)**2,0);REG={a:my-b*mx,b}}
const implied=s=>Math.exp(REG.a+REG.b*s);
function cap(){const me=D.me,f=r=>{const m=r/1200,n=360;return m/(1-Math.pow(1+m,-n))*12};
 const loanD=me.income*0.4/f(me.rate+me.stress)/10000;const c=.016;return Math.min((me.cash+Math.min(loanD,6))/(1+c),me.cash/(1-.7+c))}
function price(o){return o[sizeKey]??null}
function visible(o){if(preset!=='all'&&o.region!==preset&&!(preset==='반도체벨트'&&o.region==='기준'))return false;
 if(q&&!(o.name+o.sig).includes(q))return false;return true}
function passF(o){if(F.has('budget')){const p=o.p59;if(o.flags.includes('P')&&p==null)return true;if(p==null||p>cap())return false}
 if(F.has('noreg')&&M.regulated.includes(o.id))return false;
 if(F.has('subs')&&!D.subs.some(s=>s.dong===o.id&&isUpcoming(s)))return false;return true}
function isUpcoming(s){return !s.start||s.start>='2026-11-21'||s.start==='예정'||/^2026-12$/.test(s.start)}
const col=s=>{const t=cl((s-50)/40);if(t<.25)return `hsl(220 10% ${66-t*20}%)`;const h=265-t*25,l=66-t*36,sat=40+t*50;return `hsl(${h} ${sat}% ${l}%)`};

// ---------- 지도 ----------
function init(){
 document.getElementById('upd').textContent=D.updated+' 기준';fitModel();
 map=L.map('map',{zoomControl:false,zoomSnap:.5}).setView([37.22,127.08],10);
 L.control.zoom({position:'bottomright'}).addTo(map);
 const vw=(l,ext)=>L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VKEY}/${l}/{z}/{y}/{x}.${ext}`,{maxZoom:19,attribution:'© VWorld'});
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'});
 const T={base:VKEY.length>10?vw('Base','png'):osm,sat:L.layerGroup([vw('Satellite','jpeg'),vw('Hybrid','png')])};
 T.base.on('tileerror',()=>{if(!window._f){window._f=1;map.removeLayer(T.base);T.base=osm;osm.addTo(map)}});
 T.base.addTo(map);window._T=T;map.on('zoomend',()=>render());
 // 노선
 D.lines.forEach(l=>{const plan=!l.open||l.status==='건의';const pl=L.polyline(l.pts,{color:l.color,weight:3,opacity:.85,dashArray:plan?'6 6':null}).bindTooltip(l.name,{sticky:true});pl._d=l;lineL.push(pl)});
 D.hosp.forEach(h=>{const m=L.marker([h.lat,h.lng],{icon:L.divIcon({className:'',html:`<div class="ico" style="background:#dc2626">+</div>`,iconSize:[18,18]})});m._d=h;m.bindPopup(()=>`<b>${h.name}</b><br>${h.memo}${h.open?'<br>개원 목표 '+h.open:''}`);hospL.push(m)});
 D.anch.forEach(a=>{const m=L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',html:`<div class="ico" style="background:#2563eb">▣</div>`,iconSize:[18,18]})});m._d=a;m.bindTooltip(a.name,{direction:'top',className:'lt'});m.bindPopup(()=>`<b>${a.name}</b><br>${a.steps.map(([y,w])=>(y?y+'년~':'현재 ')+'규모 '+Math.round(w*100)).join(' · ')}<br>${a.memo}`);anchL.push(m)});
 const seen={};D.news.forEach(n=>{if(n.lat==null)return;const k=n.lat.toFixed(3)+n.lng.toFixed(3);seen[k]=(seen[k]||0)+1;const a=seen[k]*0.9,r=0.004*Math.sqrt(seen[k]);
  const m=L.circleMarker([n.lat+r*Math.sin(a),n.lng+r*Math.cos(a)],{radius:5,color:'#fff',weight:1.5,fillColor:catCol(n.cat),fillOpacity:.95});m._d=n;m.bindPopup(()=>newsHtml(n,true));newsL.push(m)});
 D.sites.filter(s=>s.src==='n3').forEach(s=>{const m=L.circle([s.lat,s.lng],{radius:1300,color:'#475569',weight:1,dashArray:'4 4',fillOpacity:.05}).bindTooltip(s.name+' · '+s.stage,{className:'lt'});m.bindPopup(`<b>${s.name}</b><br>${s.key}`);n3L.push(m)});
 D.dongs.forEach(o=>{const m=L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:'',iconSize:[0,0]})});m.on('click',()=>openDong(o.id));pinL[o.id]=m;m.addTo(map);
  (o.lead||[]).forEach((a,k)=>{if(a.lat==null)return;const am=L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="apin" style="--c:${RC[k]}"><div class="rk">${k+1}</div><div class="box"><div class="pt">${short(o)} ${k?(k+1)+'위':'대장'} · ${a.p84?'84㎡':'59㎡'}</div><div class="pp">${fmt(a.p84??a.p59)}</div></div><div class="nm">${a.name}</div></div>`})});am.on('click',()=>{openDong(o.id);pickApt(o.id,a.name)});am._o=o;aptL.push(am)})});
 // UI
 document.getElementById('pre').innerHTML=[['all','전체 경기'],['반도체벨트','반도체 벨트'],['3기·서울외곽','3기·서울 외곽']].map(([k,n])=>`<span class="chip" data-p="${k}">${n}</span>`).join('');
 document.querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{preset=c.dataset.p;fitPreset();render()});
 document.getElementById('flt').innerHTML=[['budget','내 예산 안 (59㎡)'],['noreg','비규제만'],['subs','청약 진행·예정']].map(([k,n])=>`<span class="chip" data-f="${k}">${n}</span>`).join('');
 document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{const k=c.dataset.f;F.has(k)?F.delete(k):F.add(k);render()});
 document.getElementById('tabs').innerHTML=[['dong','동네'],['news','뉴스'],['subs','청약'],['money','돈·정책'],['cmp','비교']].map(([k,n])=>`<div class="tab" data-t="${k}">${n}</div>`).join('');
 document.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{tab=c.dataset.t;sel=null;render()});
 document.getElementById('layers').innerHTML=[['rail','철도'],['jobs','일자리'],['hosp','병원'],['news','뉴스'],['subs','청약'],['n3','3기 지구'],['sat','위성']].map(([k,n])=>`<div class="lb" data-l="${k}">${n}</div>`).join('');
 document.querySelectorAll('[data-l]').forEach(c=>c.onclick=()=>{const k=c.dataset.l;if(k==='sat'){base=base==='sat'?'base':'sat';map.removeLayer(base==='sat'?_T.base:_T.sat);(base==='sat'?_T.sat:_T.base).addTo(map)}else LAY[k]=!LAY[k];render()});
 document.getElementById('sce').innerHTML=Object.entries(M.scenarios).map(([k,s])=>`<span class="chip" data-s="${k}">${s.name}</span>`).join('');
 document.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{const k=c.dataset.s;SC.has(k)?SC.delete(k):SC.add(k);render()});
 const yr=document.getElementById('yr');yr.oninput=()=>{Y=+yr.value;render()};

 const path=line.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
 const lp=line[line.length-1];
 return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;display:block">${g}${dots}<path d="${path}" fill="none" stroke="#5b3fd6" stroke-width="2"/>${line.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#fff" stroke="#5b3fd6" stroke-width="1.5"><title>${mLab(p[2])} 중앙값 ${p[3]}억 (${p[4]}건)</title></circle>`).join('')}${lp?`<text x="${Math.min(lp[0],W-40)}" y="${lp[1]-7}" font-size="10.5" font-weight="700" fill="#5b3fd6">${lp[3]}억</text>`:''}</svg>`}
function leadIdx(o){const H=HIST&&HIST[o.id];return (o.lead||[]).map(a=>H?H.apts.indexOf(a.name):-1)}
function pickApt(id,name){const H=HIST&&HIST[id];if(H){const i=H.apts.indexOf(name);if(i>=0)hApt=i}render()}
function leadBlock(o){if(!o.lead||!o.lead.length)return '';const T3=leadIdx(o);const cls=hSize==='p59'?59:84;
 return `<div class="sec" style="margin-top:4px"><h4>대장 아파트 TOP3 <span class="rs">(최근 1년 84㎡ 실거래 중앙값 순${o.proxy?' · 지구 밖 주변 단지':''})</span></h4>${o.lead.map((a,k)=>{const st=T3[k]>=0?histStats(o.id,a.p84?84:59,T3[k]):null;const pc=v=>v==null?'':`<span class="${v>0?'up':'dn'}">${v>0?'+':''}${Math.round(v*100)}%</span>`;
  return `<div class="lead ${hApt===T3[k]?'on':''}" data-la="${k}"><div class="r" style="background:${RC[k]}">${k===0?'1':k+1}</div><div><div style="font-weight:700;font-size:13px">${a.name}</div><div class="rs">${a.by}년 준공 · ${a.dong} · 거래 ${a.p84?a.n84:a.n59}건${a.approx?' · 위치 개략':''}</div></div><div style="text-align:right"><div style="font-weight:800;color:${RC[k]}">${a.p84?'84㎡ ':'59㎡ '}${fmt(a.p84??a.p59)}</div><div class="rs">${st&&st.yoy!=null?'1년 '+pc(st.yoy):''}${st&&st.fromPk!=null?' · 고점 '+pc(st.fromPk):''}</div></div></div>`}).join('')}</div>`}
function histBlock(o){const H=HIST&&HIST[o.id];const cls=hSize==='p59'?59:84;const st=histStats(o.id,cls,hApt>=0?hApt:null);
 const pct=v=>v==null?'-':`<span class="${v>0?'up':'dn'}">${v>0?'+':''}${Math.round(v*100)}%</span>`;
 const apts=H?H.apts.map((a,i)=>[a,i,H.d.filter(x=>x[3]===i&&x[1]===cls).length]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]).slice(0,12):[];
 return `<div class="sec" style="margin-top:6px"><h4>실거래 가격 추이</h4>
 <div class="chips" style="margin:0 0 6px">${[['p59','59㎡'],['p84','84㎡']].map(([k,n])=>`<span class="chip ${hSize===k?'on':''}" data-hs="${k}">${n}</span>`).join('')}${[[3,'3년'],[5,'5년'],[0,'전체']].map(([k,n])=>`<span class="chip ${hPer===k?'on':''}" data-hp="${k}">${n}</span>`).join('')}
 ${apts.length?`<select id="hapt" style="font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:3px;max-width:150px"><option value="-2" ${hApt===-2?'selected':''}>대장 TOP3 비교</option><option value="-1" ${hApt===-1?'selected':''}>동네 전체</option>${apts.map(([a,i,n])=>`<option value="${i}" ${hApt===i?'selected':''}>${a} (${n})</option>`).join('')}</select>`:''}</div>
 ${hApt===-2&&o.lead?`<div class="rs" style="margin-bottom:2px">${o.lead.map((a,k)=>`<span style="color:${RC[k]};font-weight:700">● ${a.name}</span>`).join(' ')}</div>`:''}${histSvg(o)}
 ${st?`<div class="kv" style="margin-top:6px"><div>최근 시세</div><div><b>${fmt(st.rec)}</b> (${hApt>=0?H.apts[hApt]:hApt===-2?'TOP3 합산':'동네 전체'}, 최근 4개월 중앙)</div><div>1년 전 대비</div><div>${pct(st.yoy)}</div><div>최고점 대비</div><div>${st.pk?`${pct(st.fromPk)} <span class="rs">(고점 ${st.pk.k.replace('상',' 상반기').replace('하',' 하반기')} ${fmt(st.pk.v)})</span>`:'-'}</div></div>`:''}
 <div class="note">점 = 실거래 1건, 선 = 표본 달의 중앙값. 2016~2025는 1·4·7·10월 표본(매일 조금씩 채우는 중), 최근 2년은 매월. 동네 전체 값은 신축·구축 비율에 따라 흔들리니 단지를 골라 보면 더 정확해요.</div></div>`}

function cmpHist(cs){if(!HIST)return '';const cls=sizeKey==='p59'?59:84;const S=cmp.map(id=>histStats(id,cls));if(!S.some(x=>x&&x.hy.length))return '';
 const all=S.flatMap(x=>x?x.hy:[]);const ks=[...new Set(all.map(h=>h[0]))].sort();const vs=all.map(h=>h[1]);const y0=Math.min(...vs)*.9,y1=Math.max(...vs)*1.05;
 const W=360,H=170,X=k=>24+ks.indexOf(k)/(Math.max(1,ks.length-1))*(W-34),Yv=v=>H-20-(v-y0)/(y1-y0)*(H-30);
 let g=`<div class="rs" style="margin-top:10px">${cls}㎡ 반기 중앙값 추이</div><svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
 ks.forEach((k,i)=>{if(k.endsWith('상')&&(+k.slice(0,4))%2===0)g+=`<text x="${X(k)}" y="${H-5}" font-size="9" fill="#999" text-anchor="middle">${k.slice(2,4)}</text>`});
 S.forEach((st,i)=>{if(!st)return;g+=`<polyline fill="none" stroke="${cs[i]}" stroke-width="2" points="${st.hy.map(h=>X(h[0])+','+Yv(h[1])).join(' ')}"/>`;const l=st.hy[st.hy.length-1];if(l)g+=`<text x="${X(l[0])-2}" y="${Yv(l[1])-5}" font-size="10" fill="${cs[i]}" text-anchor="end">${fmt(l[1])}</text>`});
 return g+'</svg>'}
function stageTxt(o){const s=score(o,2026).s,s36=score(o,2036).s,d=s36-s;
 if(o.id==='pangyo'||o.id==='sunae')return '기준 지역(이미 완성)';
 if(d>=15)return '2036까지 +'+Math.round(d)+'점: 앞으로 오를 요인 많음 (판교 2006~09 같은 단계)';if(d>=8)return '2036까지 +'+Math.round(d)+'점: 호재 진행 중 (판교 2011~15 같은 단계)';return '2036까지 +'+Math.round(d)+'점: 추가 호재 적음, 지금 입지로 평가'}
function dongHtml(o){const r=score(o,Y),r0=score(o,2026),W=M.weights,lab=[['강남 접근',W.gangnam],['일자리',W.jobs],['대형병원',W.hosp],['개발호재',W.dev],['학군(추정)',W.school],['공급 부담',W.supply],['쾌적(신축)',W.comfort]];
 const ys=[];for(let y=2026;y<=2036;y++)ys.push(score(o,y).s);const mn=Math.min(...ys)-3,mx=Math.max(...ys)+3;
 const spark=`<svg viewBox="0 0 200 50" style="width:200px;height:50px"><polyline fill="none" stroke="#5b3fd6" stroke-width="2" points="${ys.map((s,i)=>(i*19+5)+','+(45-(s-mn)/(mx-mn)*40)).join(' ')}"/><circle cx="${(Y-2026)*19+5}" cy="${45-(r.s-mn)/(mx-mn)*40}" r="3.5" fill="#5b3fd6"/><text x="2" y="10" font-size="8" fill="#999">2026</text><text x="198" y="10" font-size="8" fill="#999" text-anchor="end">2036</text></svg>`;
 const hs=D.hosp.map(h=>({h,t:o.t[h.id]})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t).slice(0,3);
 const as=D.anch.map(a=>({a,t:o.t[a.id]})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t).slice(0,3);
 const nn=D.news.filter(n=>n.lat!=null&&Math.hypot(n.lat-o.lat,(n.lng-o.lng)*.8)<.07).slice(0,6);
 const ss=D.subs.filter(s=>s.dong===o.id);
 const dv=M.dev[o.id];const imp=implied(r0.s),imp2=implied(r.s);
 const deg=Math.round(r.s/100*180);
 return `<div class="det"><div class="back" id="bk">← 목록</div>
 <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:19px;font-weight:800">${o.name}</div><div class="rs">${o.sig} · ${o.region}${M.regulated.includes(o.id)?' · <span class="tag r">규제지역·토허(2년 실거주)</span>':' · <span class="tag g">비규제</span>'}</div></div><div class="btn" id="addc">비교에 추가</div></div>
 <div class="gauge"><svg viewBox="0 0 120 70" style="width:120px"><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="#eee" stroke-width="12"/><path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="${col(r.s)}" stroke-width="12" stroke-dasharray="${157*r.s/100} 157"/><text x="60" y="56" font-size="22" font-weight="800" text-anchor="middle" fill="#111">${Math.round(r.s)}</text></svg>
 <div><div class="rs">${Y}년 입지 점수 ${Y>2026?`<span class="d up">▲${Math.round(r.s-r0.s)} vs 2026</span>`:''}</div>${spark}<div class="note">${stageTxt(o)}</div></div></div>
${leadBlock(o)}${histBlock(o)}
 <div class="bars">${lab.map(([n,w],k)=>`<div class="b"><span>${n}</span><div class="trk"><div class="fil" style="width:${r.parts[k]/w*100}%"></div></div><span class="rs">${r.parts[k].toFixed(1)}/${w}</span></div>`).join('')}</div>
 <div class="sec"><h4>시세 (국토부 실거래 2026.7~10 중앙값)</h4><div class="kv"><div>59㎡</div><div>${fmt(o.p59)} <span class="rs">(${o.n59}건)</span></div><div>84㎡</div><div>${fmt(o.p84)} <span class="rs">(${o.n84}건)</span></div><div>거래 많은 단지</div><div>${o.top.join(', ')||'-'}</div>${o.proxy?'<div>주의</div><div>3기 지구 안은 아직 시세 없음 → 바로 옆 기존 단지 시세</div>':''}
 ${o.p84?`<div>점수 모델가</div><div>${fmt(imp)} (2026) → ${fmt(imp2)} (${Y}) <span class="rs">· 실제 대비 ${Math.round((imp/o.p84-1)*100)}%</span></div>`:''}</div></div>
 <div class="sec"><h4>강남·병원·일자리 (차 기준)</h4><div class="kv"><div>강남역</div><div>${r.T}분 ${r.T<o.t.gangnam?'<span class="tag p">철도 개통 반영</span>':''}</div>
 ${hs.map(x=>`<div>병원</div><div>${x.h.name} ${x.t}분${x.h.open?` <span class="tag ${Y>=x.h.open?'p':''}">${x.h.open} 개원 목표</span>`:''}</div>`).join('')}
 ${as.map(x=>`<div>일자리</div><div>${x.a.name} ${x.t}분</div>`).join('')}</div></div>
 ${dv?`<div class="sec"><h4>개발호재</h4><div class="ns">${dv[3]} (${dv[0]}~${dv[1]})</div></div>`:''}
 ${ss.length?`<div class="sec"><h4>청약</h4>${ss.map(s=>`<div class="ns">· ${s.name} (${s.start||''}, ${s.n}가구${s.url?`, <a href="${s.url}" target="_blank">링크</a>`:''})</div>`).join('')}</div>`:''}
 <div class="sec"><h4>근처 소식</h4>${nn.length?nn.map(n=>`<div class="news" style="padding:8px 0">${newsHtml(n)}</div>`).join(''):'<div class="note">아직 없음</div>'}</div>
 <div class="note" style="margin-top:10px">점수는 공개 자료 기반 모델 추정이에요. 학군은 임시 추정치이고, 시간은 차 기준(막힘 미반영)이에요. 투자 권유가 아니에요.</div></div>`}
function openDong(id){if(sel!==id)hApt=-2;sel=id;const o=D.dongs.find(d=>d.id===id);location.hash=id;render();if(window.innerWidth>860)map.panTo([o.lat,o.lng])}
function bindList(){document.querySelectorAll('[data-d]').forEach(e=>e.onclick=ev=>{if(ev.target.tagName==='A')return;const o=D.dongs.find(d=>d.id===e.dataset.d);map.flyTo([o.lat,o.lng],12.5,{duration:.6});openDong(o.id)});
 document.querySelectorAll('[data-n]').forEach(e=>e.onclick=ev=>{if(ev.target.tagName==='A')return;const m=newsL.find(m=>m._d.id===e.dataset.n);if(m){if(!LAY.news){LAY.news=true;render()}map.flyTo(m.getLatLng(),12,{duration:.6});setTimeout(()=>m.openPopup(),650)}});
 document.querySelectorAll('[data-nc]').forEach(e=>e.onclick=()=>{ncat=e.dataset.nc;render()});
 const sk=document.getElementById('sk');if(sk)sk.onchange=()=>{sortKey=sk.value;render()};
 const pk=document.getElementById('pk');if(pk)pk.onchange=()=>{pinMode=pk.value;render()};const zk=document.getElementById('zk');if(zk)zk.onchange=()=>{sizeKey=zk.value;render()};
 [['mc','cash'],['mi','income'],['mr','rate'],['ms','stress']].forEach(([i,k])=>{const e=document.getElementById(i);if(e)e.onchange=()=>{D.me[k]=+e.value;render()}});
 const cc=document.getElementById('cclr');if(cc)cc.onclick=()=>{cmp=[];render()}}
function bindDet(){document.querySelectorAll('[data-la]').forEach(e=>e.onclick=()=>{const o=D.dongs.find(d=>d.id===sel),a=o.lead[+e.dataset.la];const T3=leadIdx(o);hApt=T3[+e.dataset.la];if(a.p84==null)hSize='p59';if(a.lat)map.flyTo([a.lat,a.lng],15,{duration:.6});render()});document.querySelectorAll('[data-hs]').forEach(e=>e.onclick=()=>{hSize=e.dataset.hs;if(hApt>=0)hApt=-2;render()});document.querySelectorAll('[data-hp]').forEach(e=>e.onclick=()=>{hPer=+e.dataset.hp;render()});const ha=document.getElementById('hapt');if(ha)ha.onchange=()=>{hApt=+ha.value;render()};
document.getElementById('bk').onclick=()=>{sel=null;location.hash='';render()};
 document.getElementById('addc').onclick=()=>{if(!cmp.includes(sel)){cmp.push(sel);if(cmp.length>3)cmp.shift()}tab='cmp';sel=null;render()};
 document.querySelectorAll('.det [data-n],.det a').forEach(()=>{})}
</script>
</body>
</html>
