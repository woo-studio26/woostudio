*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--fg);background:var(--bg)}
.app{display:grid;grid-template-columns:340px 1fr 320px;height:100vh}
.side{background:var(--card);border-right:1px solid var(--bd);overflow:auto;padding:18px 18px 40px}

.brand{font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:700}
h1{font-size:22px;margin:6px 0 4px;letter-spacing:-.02em;line-height:1.3}
.sub{color:var(--mut);font-size:13px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 16px}
.facts div{background:var(--hl);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--mut)}
.facts b{display:block;color:var(--fg);font-size:14px}
h2{font-size:14px;margin:18px 0 8px;letter-spacing:-.01em}
.concepts{display:flex;flex-wrap:wrap;gap:6px}
.concepts button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.concepts button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.cdesc{font-size:12px;color:var(--mut);margin-top:6px;min-height:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}

.tabs button.on{background:var(--acc);color:#fff}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s{border:2px solid transparent;border-radius:10px;cursor:pointer;background:var(--hl);padding:4px;text-align:left}
.s.on{border-color:var(--acc)}

.s .br{font-size:10px;color:var(--mut)}
.view{position:relative;background:#e9e7e1;overflow:hidden}
#cv{width:100%;height:100%;display:block}
.vbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.vbar button{border:0;background:rgba(255,255,255,.92);border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vbar button.on{background:var(--fg);color:#fff}
.hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:#5b5b62;background:rgba(255,255,255,.8);border-radius:6px;padding:3px 8px}
.lbl{font-size:11px;color:#333;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:5px;white-space:nowrap;pointer-events:none}
.pkgs{display:grid;gap:8px}
.pk{border:2px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card)}
.pk.on{border-color:var(--acc);background:#f4f7fb}
.pk .t{font-weight:700;font-size:15px}
.pk .d{font-size:12px;color:var(--mut);margin-top:2px}
.total{margin-top:14px;background:var(--fg);color:#fff;border-radius:14px;padding:14px 16px}
.total .l{font-size:12px;opacity:.75}
.total .v{font-size:26px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.total .p{font-size:12px;opacity:.75;margin-top:2px}
.lines{font-size:12px;margin-top:10px}
.lines div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--bd)}
.lines span:last-child{font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap;margin-left:8px}
.sel{font-size:12px;margin-top:10px;background:var(--hl);border-radius:10px;padding:8px 10px}
.sel div{padding:2px 0}
.cta{display:block;text-align:center;margin-top:14px;background:var(--acc);color:#fff;text-decoration:none;border-radius:12px;padding:13px;font-weight:700}
.cta2{display:block;text-align:center;margin-top:8px;border:1px solid var(--bd);color:var(--fg);text-decoration:none;border-radius:12px;padding:11px;font-size:14px}
.note{font-size:11px;color:var(--mut);margin-top:12px;line-height:1.5}
@media(max-width:1000px){.app{grid-template-columns:1fr;height:auto}.view{height:62vh;order:-1}.side{border:0}.side.r{border:0}}

.galt{font-size:12px;color:var(--mut);margin:-4px 0 6px}
