body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;

h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5.5vw,36px);line-height:1.2}
h2{font-size:20px}
h3{font-size:19px}

label{cursor:pointer}

select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px;vertical-align:-3px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:14px}

ul.l{margin:0;padding-left:18px;font-size:14px}ul.l li{margin:4px 0}

const key=(m,k)=>m+"_"+k;
function base(m){const L=[];if(m==="rent"){L.push(["대관료","정가 300 → 당일 혜택",100]);if(V)L.push(["대관료 부가세","10%",10]);L.push(["생화장식 (필수)","정가 100 → 당일 50%",50]);}
 else{L.push(["패키지","450 → 300 → 당일 280 · 홀+생화+드레스·턱시도+신랑신부 헤메+부케+원판 앨범 3권",280]);if(V)L.push(["패키지 부가세","10%",28]);L.push(["드레스 헬퍼","녹음엔 '별도'만, 15로 계산",15]);}
 L.push(["식대",`43,000원 × ${Math.max(G,150)}명 (음주류 포함, 보증 150부터)`,Math.max(G,150)*4.3]);return L}
function optsum(m){return OPT[m].reduce((a,o)=>a+o.c[sel[key(m,o.k)]??o.d][1],0)}
function total(m){return base(m).reduce((a,x)=>a+x[2],0)+optsum(m)}
function render(){
 document.getElementById("t-rent").className=M==="rent"?"on":"";document.getElementById("t-pkg").className=M==="pkg"?"on":"";
 document.getElementById("base").innerHTML=base(M).map(x=>`<tr><td>${x[0]}<small>${x[1]}</small></td><td>${f(x[2])}</td></tr>`).join("")+`<tr class="grp"><td>기본 소계</td><td>${f(base(M).reduce((a,x)=>a+x[2],0))}</td></tr>`;
 document.getElementById("opt-h").textContent=M==="rent"?"대관이면 우리가 따로 챙길 것":"패키지 옵션 · 추가로 생길 수 있는 돈";
 document.getElementById("opts").innerHTML=OPT[M].map(o=>{const i=sel[key(M,o.k)]??o.d;return `<div class="opt"><h3>${o.t}<span>${f(o.c[i][1])}</span></h3><select data-k="${o.k}">${o.c.map((c,j)=>`<option value="${j}" ${j==i?"selected":""}>${c[0]}</option>`).join("")}</select><ul class="how">${o.how.map(h=>`<li>${h}</li>`).join("")}</ul>${o.ask?`<div class="ask"><b>물어볼 것</b> · ${o.ask}</div>`:""}</div>`}).join("");
 document.querySelectorAll("#opts select").forEach(s=>s.onchange=()=>{sel[key(M,s.dataset.k)]=+s.value;save();render()});
 const t=total(M),o=total(M==="rent"?"pkg":"rent");
 document.getElementById("tot").innerHTML=`${f(t)}<small> 만원 · ${M==="rent"?"대관":"패키지"} · 하객 ${G}명</small>`;
 document.getElementById("tot2").innerHTML=`기본 ${f(base(M).reduce((a,x)=>a+x[2],0))} + 옵션 ${f(optsum(M))} · 참고: ${M==="rent"?"패키지":"대관"}로 하면 ${f(o)}${M==="pkg"?" (대구 스튜디오 촬영은 양쪽 다 별도)":" (대구 스튜디오 촬영 별도)"}`;
 const extra=OPT[M].filter(x=>x.ask).map(x=>`<li><b>${x.t}</b> — ${x.ask}</li>`).join("");
 document.getElementById("asks").innerHTML=`<h3 class="sub" style="margin:4px 0">${M==="rent"?"대관":"패키지"}일 때</h3><ul class="l">${extra}</ul><h3 class="sub" style="margin:12px 0 4px">공통</h3><ul class="l">${ASK_COMMON.map(a=>`<li>${a}</li>`).join("")}</ul>`;}
function save(){try{localStorage.setItem("maison_cost",JSON.stringify({M,G,V,sel}))}catch(e){}}
document.getElementById("t-rent").onclick=()=>{M="rent";save();render()};document.getElementById("t-pkg").onclick=()=>{M="pkg";save();render()};
const g=document.getElementById("g");g.value=G;g.oninput=()=>{G=+g.value||150;save();render()};
const v=document.getElementById("vat");v.checked=V;v.onchange=()=>{V=v.checked;save();render()};
render();})();</script></body></html>
