<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>메탈사이딩 시공 순서 | 자재와 부자재</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1d1d1f;background:#eef0f2}
#wrap{display:flex;flex-direction:column;height:100%}
#view{flex:1;position:relative;min-height:300px}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.lab{background:rgba(255,255,255,.94);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.3;box-shadow:0 1px 4px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none;border-left:4px solid #999}
.lab.m{border-color:#e0b84a}.lab.s{border-color:#ff7a1a}.lab.f{border-color:#d63b3b}.lab.w{border-color:#2f80ed}.lab.x{border-color:#777}
.lab b{display:block;font-size:12.5px}
.legend{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.legend span{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 10px;font-size:11.5px;display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#panel{background:#fff;border-top:1px solid #ddd;padding:12px 14px 14px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.steps button{flex:none;border:1px solid #ddd;background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:#555}
.steps button.done{background:#f3f4f6;color:#333}
.steps button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.card{display:grid;grid-template-columns:1fr;gap:4px;margin-top:4px}
.kind{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:2px}
.kind.m{background:#fbf0cf;color:#8a6a00}.kind.s{background:#ffe6d3;color:#b04a00}.kind.f{background:#fde2e2;color:#a51d1d}.kind.w{background:#ddeafd;color:#1d5fbf}.kind.x{background:#eee;color:#555}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.01em}
.desc{font-size:13.5px;line-height:1.55;color:#333;margin:4px 0}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#666}
.meta b{color:#222;font-weight:600}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{flex:1;border:0;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;background:#f0f0f2}
.nav button.pri{background:#0a84ff;color:#fff;font-weight:600}
.diff{margin-top:12px;border-top:1px solid #eee;padding-top:10px;font-size:12.5px;color:#444;line-height:1.55}
.diff b{color:#111}
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <div class="legend">
      <span><i style="background:#e8d79a"></i>자재 (사이딩 판)</span>
      <span><i style="background:#ff7a1a"></i>부자재 (끼우고 덮는 틀)</span>
      <span><i style="background:#d63b3b"></i>고정 (피스·칼블럭)</span>
      <span><i style="background:#2f80ed"></i>방수 (실리콘)</span>
    </div>
  </div>
  <div id="panel">
    <div class="steps" id="steps"></div>
    <div class="card">
      <div><span class="kind" id="kind"></span><span class="ttl" id="ttl"></span></div>
      <div class="desc" id="desc"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="nav"><button id="prev">이전</button><button id="play">자동 재생</button><button class="pri" id="next">다음 단계</button></div>
    <div class="diff"><b>자재</b> = 벽에 보이는 면을 만드는 판(사이딩). 면적만큼 들어감(박스 단위). <b>부자재</b> = 판을 받쳐 주고(스타터), 끼우고(조이너·아웃코너), 잘린 끝을 덮는(J채널) 3m 길이 틀. 길이만큼 들어감(본 단위). 순서는 <b>부자재 먼저 → 자재 끼우기 → 마감 부자재로 덮기 → 실리콘</b>.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
// 단위 m. 코너 일부만 확대(전면 3.4m, 측면 1.4m 구간). 전면 = z+ 방향, 측면 = x- 방향.
var view=document.getElementById('view');
var renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(renderer.domElement);
var lr=new THREE.CSS2DRenderer(); lr.domElement.style.position='absolute'; lr.domElement.style.top='0'; lr.domElement.style.pointerEvents='none'; view.appendChild(lr.domElement);
var scene=new THREE.Scene(); scene.background=new THREE.Color('#e3e8ec');
var camera=new THREE.PerspectiveCamera(38,1,0.05,100);
var controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(1.0,0.85,-0.2);
scene.add(new THREE.HemisphereLight(0xffffff,0x888880,0.8)); var dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(-3,5,6); scene.add(dl);

function M(c,o){var p={color:c,roughness:.8,metalness:.05};for(var k in o)p[k]=o[k];return new THREE.MeshStandardMaterial(p);}
function box(x0,y0,z0,x1,y1,z1,mat,grp){var m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),mat);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);(grp||scene).add(m);return m;}
var FW=3.4, SD=1.4, Y0=0.05, H=1.6, YT=Y0+H, T=0.016;
var wallM=M('#cfc8bc'); var stoneM=M('#c9c1b3'); var awnM=M('#1b5c46');
// 바탕 벽 (단계 0에 포함)
var base=new THREE.Group(); scene.add(base);
box(0,-0.4,-0.3,FW,YT+0.45,0,wallM,base);          // 전면 벽 (건물은 x>0, z<0)
box(0,-0.4,-SD,0.3,YT+0.45,0,wallM,base);           // 측면 벽
box(-0.03,YT,-SD,FW,YT+0.4,0.03,stoneM,base);       // 화강석 띠
box(-0.03,YT,-SD,0.3,YT+0.4,0.03,stoneM,base);
box(0.2,-0.4,0,FW,-0.2,0.7,awnM,base);              // 어닝(전면)
box(-0.7,-0.4,-SD,0,-0.2,-0.1,awnM,base);           // 어닝(측면)
// 벽 질감 (철거 후 거친 면)
(function(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');g.fillStyle='#9d9a95';g.fillRect(0,0,128,128);for(var i=0;i<2200;i++){g.fillStyle='rgba(0,0,0,'+Math.random()*.15+')';g.fillRect(Math.random()*128,Math.random()*128,2,2);}var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,4);wallM.map=t;wallM.color.set('#fff');})();

// ---- 부품 만들기 ----
var COL={m:'#e8d79a',s:'#ff7a1a',sDone:'#f4f4f2',f:'#d63b3b',w:'#2f80ed'};
function grp(){var g=new THREE.Group();g.visible=false;scene.add(g);return g;}
function label(g,pos,cls,title,sub){var d=document.createElement('div');d.className='lab '+cls;d.innerHTML='<b>'+title+'</b>'+(sub||'');var o=new THREE.CSS2DObject(d);o.position.copy(pos);g.add(o);g.userData.labels=(g.userData.labels||[]).concat([o]);return o;}
function screwsFront(g,y,x0,x1,step,d){d=d||0.03;for(var x=x0;x<=x1;x+=step){box(x-0.006,y-0.006,0.0,x+0.006,y+0.006,d,M(COL.f),g);}}
function screwsSide(g,y,z0,z1,step,d){d=d||0.03;for(var z=z0;z>=z1;z-=step){box(-d,y-0.006,z-0.006,0,y+0.006,z+0.006,M(COL.f),g);}}

// 1 스타터: 벽에 붙는 날개 35 + 앞 턱 8
var gStarter=grp(); var sM=M(COL.s,{metalness:.4,roughness:.4});
box(0.04,Y0-0.03,0,FW,Y0+0.005,0.003,sM,gStarter); box(0.04,Y0-0.03,0,FW,Y0-0.025,0.008,sM,gStarter);
box(-0.003,Y0-0.03,-SD,0,Y0+0.005,-0.04,sM,gStarter); box(-0.008,Y0-0.03,-SD,0,Y0-0.025,-0.04,sM,gStarter);
screwsFront(gStarter,Y0-0.012,0.2,FW,0.4); screwsSide(gStarter,Y0-0.012,-0.2,-SD,0.4);
label(gStarter,new THREE.Vector3(1.6,Y0-0.02,0.02),'s','스타터','맨 아래 받침 · 8×35×3000');

// 2 아웃코너 40×40
var gCorner=grp(); var cM=M(COL.s,{metalness:.4,roughness:.4});
box(-0.026,Y0-0.03,-0.004,0.04,YT,0.026,cM,gCorner); // 바깥 커버 (전면쪽)
box(-0.026,Y0-0.03,-0.04,0.004,YT,0.026,cM,gCorner); // 측면쪽
label(gCorner,new THREE.Vector3(-0.03,0.9,0.03),'s','아웃코너','모서리 · 40×40×3000');

// 3 조이너 (전면 3m 지점)
var gJoin=grp(); var jM=M(COL.s,{metalness:.4,roughness:.4});
box(2.98,Y0-0.03,0,3.02,YT,0.003,jM,gJoin); box(2.997,Y0-0.03,0,3.003,YT,0.027,jM,gJoin); box(2.98,Y0-0.03,0.024,3.02,YT,0.027,jM,gJoin);
screwsFront(gJoin,0.3,2.988,2.988,1); screwsFront(gJoin,1.2,2.988,2.988,1);
label(gJoin,new THREE.Vector3(3.0,1.0,0.03),'s','아이조이너','3m 판 이음 · 27×40×3000');

// 사이딩 패널 텍스처(스타코)
function stucco(){var c=document.createElement('canvas');c.width=512;c.height=64;var g=c.getContext('2d');g.fillStyle='#ece8de';g.fillRect(0,0,512,64);for(var i=0;i<5000;i++){var k=Math.random();g.fillStyle=k>.5?'rgba(255,255,255,.35)':'rgba(0,0,0,.07)';g.fillRect(Math.random()*512,Math.random()*64,1.5,1.5);}g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,512,3);var t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;return t;}
var stT=stucco();
function panelMat(len){var t=stT.clone();t.needsUpdate=true;t.repeat.set(len/3,1);return M('#fff',{map:t,roughness:.7});}
function rowFront(g,y0,h,x0,x1){var m=box(x0,y0,0.0,x1,y0+h,T,panelMat(x1-x0),g);box(x0,y0+h-0.004,0,x1,y0+h+0.004,T+0.002,M('#8a8780'),g);return m;}
function rowSide(g,y0,h,z0,z1){var m=box(-T,y0,z1,0,y0+h,z0,panelMat(Math.abs(z1-z0)),g);box(-T-0.002,y0+h-0.004,z1,0,y0+h+0.004,z0,M('#8a8780'),g);return m;}

// 4 첫 줄
var gRow1=grp();
rowFront(gRow1,Y0,0.38,0.012,2.995); rowFront(gRow1,Y0,0.38,3.005,FW); rowSide(gRow1,Y0,0.38,-0.012,-SD);
screwsFront(gRow1,Y0+0.388,0.2,FW,0.4,0.014); screwsSide(gRow1,Y0+0.388,-0.2,-SD,0.4,0.014);
label(gRow1,new THREE.Vector3(1.4,Y0+0.19,0.03),'m','사이딩 첫 줄','16×380×3000 · 아래 홈을 스타터 턱에 걸기');
label(gRow1,new THREE.Vector3(0.8,Y0+0.39,0.04),'f','피스+칼블럭','위 날개에 @400');

// 5 2~4줄 (한 줄씩)
var gRows=[];
for(var r=1;r<4;r++){var g=grp();var y=Y0+0.38*r;rowFront(g,y,0.38,0.012,2.995);rowFront(g,y,0.38,3.005,FW);rowSide(g,y,0.38,-0.012,-SD);screwsFront(g,y+0.388,0.2,FW,0.4,0.014);screwsSide(g,y+0.388,-0.2,-SD,0.4,0.014);gRows.push(g);}
label(gRows[2],new THREE.Vector3(1.4,Y0+0.38*3+0.19,0.03),'m','사이딩 2~4줄','아랫줄 혀에 끼우고 위 날개 고정');

// 6 상단 80 띠
var gStrip=grp(); var ys=Y0+0.38*4;
box(0.012,ys,0,FW,YT-0.01,T,panelMat(FW),gStrip); box(-T,ys,-SD,0,YT-0.01,-0.012,panelMat(SD),gStrip);
label(gStrip,new THREE.Vector3(1.9,ys+0.04,0.03),'m','상단 80 띠','사이딩을 길게 잘라 끼움');

// 7 J채널 (상단)
var gJ=grp(); var jjM=M(COL.s,{metalness:.4,roughness:.4});
box(0.02,YT-0.035,0,FW,YT,0.035,jjM,gJ); box(0.02,YT-0.05,0.03,FW,YT-0.03,0.035,jjM,gJ);
box(-0.035,YT-0.035,-SD,0,YT,-0.02,jjM,gJ); box(-0.035,YT-0.05,-SD,-0.03,YT-0.03,-0.02,jjM,gJ);
label(gJ,new THREE.Vector3(2.4,YT-0.03,0.04),'s','J채널','위·벽 끝 절단면 덮기 · 35×50×3000');

// 8 실리콘
var gSil=grp(); var silM=M(COL.w,{roughness:.3});
box(-0.03,YT-0.002,0.03,FW,YT+0.01,0.042,silM,gSil); box(-0.042,YT-0.002,-SD,-0.03,YT+0.01,0.03,silM,gSil);
box(-0.032,Y0,0.026,-0.024,YT,0.034,silM,gSil); box(2.976,Y0+0.02,0.026,2.984,YT-0.04,0.032,silM,gSil);
label(gSil,new THREE.Vector3(1.0,YT+0.02,0.05),'w','변성실리콘','화강석 밑·코너·이음 (아래 끝은 막지 않음)');

// 9 간판
var gSign=grp();
var disc=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.15,64),[M('#8e5a6c'),M('#fbfbf9'),M('#fbfbf9')]);disc.rotation.x=Math.PI/2;disc.position.set(2.1,Y0+0.8,T+0.075+0.01);gSign.add(disc);
label(gSign,new THREE.Vector3(2.1,Y0+0.8,0.2),'x','원형 간판 Ø1m (간판업체)','볼트는 스페이서 끼워 벽까지');

var STEPS=[
 {t:'바탕 벽 (철거 후)',k:'x',kt:'준비',g:[],d:'기존 파벽돌과 합판을 떼어 낸 벽입니다. 사이딩은 하지(각관) 없이 이 벽에 바로 고정하므로 크게 울퉁불퉁한 곳만 쐐기로 맞춥니다.',m:[['범위','전면 5m · 측면 12m · 높이 1.6m'],['화면','코너 부분만 확대']]},
 {t:'스타터',k:'s',kt:'부자재 ①',g:[gStarter],d:'맨 아래에 수평으로 먼저 붙이는 받침입니다. 첫 줄 사이딩의 아래 홈이 이 턱에 걸립니다. 여기 수평이 틀어지면 위 줄이 전부 틀어집니다.',m:[['규격','8×35×3000'],['수량','6본'],['고정','피스+칼블럭 @400']]},
 {t:'아웃코너',k:'s',kt:'부자재 ②',g:[gCorner],d:'전면과 측면이 만나는 모서리에 세우는 틀입니다. 양쪽 사이딩 끝을 이 안에 10~15mm 넣어 잘린 면을 감춥니다.',m:[['규격','40×40×3000'],['수량','1본 (1.6m 사용)']]},
 {t:'아이조이너',k:'s',kt:'부자재 ③',g:[gJoin],d:'판 길이가 3m라서 3m마다 이음이 생깁니다. 그 자리에 세로로 세워 두 판의 끝을 양쪽에서 끼웁니다. 판 끝은 5mm 띄웁니다(열팽창).',m:[['규격','27×40×3000'],['수량','4본 (전면 3m, 측면 3·6·9m)']]},
 {t:'사이딩 첫 줄',k:'m',kt:'자재 ①',g:[gRow1],d:'이제 자재입니다. 아래 홈을 스타터 턱에 걸고, 양 끝은 아웃코너·조이너 속에 넣은 뒤, 위쪽 날개를 피스로 벽에 고정합니다.',m:[['규격','16×380×3000'],['한 줄','17m (전면 5 + 측면 12)']]},
 {t:'사이딩 2~4줄',k:'m',kt:'자재 ②',g:gRows,d:'윗줄 아래 홈을 아랫줄 위 혀에 끼워 내려 앉히고, 다시 위 날개를 고정합니다. 피스는 다음 줄에 가려 밖에서 안 보입니다.',m:[['줄 수','380 × 4줄 = 1.52m'],['판','4박스 (25장 사용)']]},
 {t:'상단 80 띠',k:'m',kt:'자재 ③',g:[gStrip],d:'1.6m에서 4줄(1.52m)을 빼고 남는 80mm는 사이딩을 길게 잘라 끼웁니다. 잘린 윗면은 다음 단계 J채널이 덮습니다.',m:[['폭','80mm'],['재료','남는 판에서 잘라 씀']]},
 {t:'J채널',k:'s',kt:'부자재 ④',g:[gJ],d:'사이딩 위 끝(그리고 5m·12m 벽 끝)의 잘린 면을 덮는 마감 틀입니다. 절단면을 덮어야 녹·물 들어감을 막습니다.',m:[['규격','35×50×3000'],['수량','8본']]},
 {t:'실리콘',k:'w',kt:'방수',g:[gSil],d:'화강석 띠 밑, 코너, 이음에 변성실리콘을 쏩니다. 맨 아래 스타터 쪽은 물이 빠져야 하니 막지 않습니다.',m:[['제품','KCC 변성실리콘'],['수량','12개']]},
 {t:'간판 부착',k:'x',kt:'간판업체',g:[gSign],d:'간판업체가 원형 간판을 답니다. 사이딩 구멍에는 스페이서 파이프를 넣어 폼이 눌리지 않게 하고, 볼트는 벽까지 박습니다.',m:[['크기','Ø1m × 150'],['담당','간판업체']]}
];
var cur=0, anim=[];
var stepsEl=document.getElementById('steps');
STEPS.forEach(function(s,i){var b=document.createElement('button');b.textContent=(i)+'. '+s.t;b.onclick=function(){go(i)};stepsEl.appendChild(b);});
function setLabels(g,show){(g.userData.labels||[]).forEach(function(o){o.visible=show;});}
function tint(g,on){g.traverse(function(o){if(o.isMesh){var ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(function(m){if(m.emissive){m.emissive.set(on?'#ff7a1a':'#000');m.emissiveIntensity=on?.0:0;}});}});}
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  STEPS.forEach(function(s,k){s.g.forEach(function(g,gi){
    var vis=k<=cur; if(vis&&!g.visible&&k===cur){g.visible=true;g.userData.t0=performance.now()+gi*350;g.userData.anim=true;} else g.visible=vis;
    setLabels(g,k===cur);
    // 부자재는 지난 단계면 실제 색(화이트)으로
    g.traverse(function(o){if(o.isMesh&&o.material&&o.material.color&&o.userData.orig===undefined){o.userData.orig=o.material.color.getHexString();}});
    var isAcc=s.k==='s';
    g.traverse(function(o){if(o.isMesh&&isAcc&&o.userData.orig==='ff7a1a'){o.material.color.set(k===cur?COL.s:COL.sDone);}});
  });});
  [...stepsEl.children].forEach(function(b,k){b.className=k===cur?'on':(k<cur?'done':'');});
  stepsEl.children[cur].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  var s=STEPS[cur];
  var kd=document.getElementById('kind');kd.textContent=s.kt;kd.className='kind '+s.k;
  document.getElementById('ttl').textContent=s.t;
  document.getElementById('desc').textContent=s.d;
  document.getElementById('meta').innerHTML=s.m.map(function(x){return '<span>'+x[0]+' <b>'+x[1]+'</b></span>';}).join('');
}
document.getElementById('prev').onclick=function(){stop();go(cur-1)};
document.getElementById('next').onclick=function(){stop();go(cur+1)};
var timer=null;function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='자동 재생';}}
document.getElementById('play').onclick=function(){if(timer){stop();return;}if(cur>=STEPS.length-1)go(0);this.textContent='멈춤';timer=setInterval(function(){if(cur>=STEPS.length-1){stop();return;}go(cur+1);},2600);};

function resize(){var w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);lr.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();var far=w<500?5.2:4.2;camera.position.set(-1.7*far/4.2,1.45,far);controls.update();}
window.addEventListener('resize',resize);
resize(); go(0);
(function loop(now){requestAnimationFrame(loop);
  scene.traverse(function(g){if(g.userData&&g.userData.anim){var t=(performance.now()-g.userData.t0)/600;if(t<0){g.position.set(-0.6,0.25,0.6);}else if(t<1){var e=1-Math.pow(1-t,3);g.position.set(-0.6*(1-e),0.25*(1-e),0.6*(1-e));}else{g.position.set(0,0,0);g.userData.anim=false;}}});
  controls.update();renderer.render(scene,camera);lr.render(scene,camera);})();
window.BUILD_PAGE={version:'b2',steps:STEPS.length};
</script>
</body>
</html>
