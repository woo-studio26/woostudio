<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>용인·평택 개발 호재 지도 피드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:#111827;background:#f3f4f6}
#app{display:grid;grid-template-columns:1fr 420px;height:100vh}
#map{height:100%}
#side{display:flex;flex-direction:column;background:#fff;border-left:1px solid #e5e7eb;min-height:0}
header{padding:14px 16px 10px;border-bottom:1px solid #e5e7eb}
h1{font-size:17px;margin:0 0 2px}
.sub{font-size:12px;color:#6b7280}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
.chip.on{background:#111827;color:#fff;border-color:#111827}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tabs{display:flex;border-bottom:1px solid #e5e7eb}
.tab{flex:1;text-align:center;padding:9px 0;font-size:13px;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent}
.tab.on{color:#111827;border-bottom-color:#111827;font-weight:600}
#list{overflow:auto;flex:1;padding:6px 0}
.item{padding:10px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.item:hover{background:#f9fafb}
.item.sel{background:#eef2ff}
.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;font-weight:600}
.new{background:#facc15;color:#111827}
.ttl{font-size:14px;font-weight:600;margin:3px 0 3px;line-height:1.35}
.sum{font-size:12.5px;color:#374151;line-height:1.5}
.src{font-size:11px;margin-top:4px}
.src a{color:#2563eb;text-decoration:none}
.empty{padding:30px;text-align:center;color:#9ca3af;font-size:13px}
.ms{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:13px}
.ms b{font-size:12px;color:#111827}
.ms .past{color:#9ca3af}
.sitecard{padding:10px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.stage{display:flex;gap:2px;margin-top:5px}
.stage span{flex:1;height:5px;border-radius:2px;background:#e5e7eb}
.stage span.f{background:#111827}
.stg{font-size:10.5px;color:#6b7280;margin-top:2px}
.lbl{background:rgba(255,255,255,.92);border:1px solid #d1d5db;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600;box-shadow:none;color:#111827}
.lbl:before{display:none}
.basemap{filter:grayscale(.85) brightness(1.05) contrast(.9)}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.5}
.pop h3{margin:0 0 3px;font-size:14px}
.pop .k{color:#374151;margin:4px 0}
.pop ul{margin:4px 0 0;padding-left:16px}
.pop li{margin:2px 0}
.legend{background:#fff;padding:8px 10px;border-radius:6px;font-size:11.5px;box-shadow:0 1px 4px rgba(0,0,0,.2);line-height:1.7}
.reset{font-size:12px;color:#2563eb;cursor:pointer;margin-left:auto}
.filterbar{display:flex;align-items:center;padding:6px 16px;font-size:12px;color:#374151;background:#f9fafb;border-bottom:1px solid #e5e7eb}
.watchicon{background:#7c3aed;color:#fff;border:2px solid #fff;border-radius:4px;font-size:10px;font-weight:700;text-align:center;line-height:16px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
@media(max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:48vh 1fr;height:auto;min-height:100vh}
 #side{border-left:none;border-top:1px solid #e5e7eb}
 #list{overflow:visible}
 .legend{display:none}
}
</style>
</head>
<body>
<div id="app">
 <div id="map"></div>
 <div id="side">
  <header>
   <h1>용인·평택 개발 호재 지도 피드</h1>
   <div class="sub" id="upd"></div>
   <div class="chips" id="regionChips"></div>
   <div class="chips" id="catChips"></div>
   <div class="chips" id="etcChips"></div>
  </header>
  <div class="tabs">
   <div class="tab on" data-t="news">뉴스</div>
   <div class="tab" data-t="sites">거점</div>
   <div class="tab" data-t="ms">앞으로 일정</div>
  </div>
  <div class="filterbar" id="fbar" style="display:none"><span id="fname"></span><span class="reset" id="freset">전체 보기</span></div>
  <div id="list"></div>
 </div>
</div>
<script>
const STAGES=['계획','설계','보상','착공','공사중','완공'];
let D,map,markers={},circles={},watchLayer,state={region:'전체',cats:new Set(['ind','trn','hou','risk']),site:null,tab:'news',days:0,watch:true};
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{D=d;window.FEED=d;init()});
function daysAgo(s){return Math.round((new Date(D.updated)-new Date(s))/864e5)}
function site(id){return D.sites.find(s=>s.id===id)}
function init(){
 document.getElementById('upd').textContent=`${D.updated} 기준 · 뉴스 ${D.news.length}건 · 거점 ${D.sites.length}곳 · 핀을 누르면 그 거점 소식만`;
 map=L.map('map',{zoomControl:true,zoomSnap:.5});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18,className:'basemap'}).addTo(map);
 const LEFT=['nat','platform','giheung','godeok','seojeong','anjung'];
 D.sites.forEach(s=>{
  const c=D.cats[s.cat].color;
  if(s.r) circles[s.id]=L.circle([s.lat,s.lng],{radius:s.r,color:c,weight:1,fillColor:c,fillOpacity:.08,dashArray:'4 4'}).addTo(map);
  const n=D.news.filter(x=>x.site===s.id).length, fresh=D.news.filter(x=>x.site===s.id&&daysAgo(x.date)<=7).length;
  const m=L.circleMarker([s.lat,s.lng],{radius:7+Math.min(n,6),color:'#fff',weight:2,fillColor:c,fillOpacity:.95}).addTo(map);
  m.on('add',()=>setTimeout(()=>map.fire('zoomend'),0));
  m.bindTooltip(s.name.replace(/ \(.*\)/,'')+(fresh?` · 새 소식 ${fresh}`:''),{permanent:true,direction:LEFT.includes(s.id)?'left':'right',offset:[LEFT.includes(s.id)?-8:8,0],className:'lbl'});
  m.bindPopup(()=>popup(s),{maxWidth:300});
  m.on('click',()=>{state.site=s.id;state.tab='news';render()});
  markers[s.id]=m;
 });
 const BIG=['sk','nat','idong','platform','ptcampus','brain','anjung','rail_s'];
 const lab=()=>{const z=map.getZoom();D.sites.forEach(s=>{const t=markers[s.id].getTooltip();if(!t)return;const el=t.getElement();if(el)el.style.display=(z>=12||BIG.includes(s.id))?'':'none'})};
 map.on('zoomend',lab);setTimeout(lab,50);
 watchLayer=L.layerGroup(D.watch.map(w=>L.marker([w.lat,w.lng],{icon:L.divIcon({className:'',html:'<div class="watchicon">관</div>',iconSize:[18,18],iconAnchor:[24,24]})}).bindPopup(`<div class="pop"><h3>${w.name} <span style="font-size:11px;color:#7c3aed">mg 관심 지역</span></h3><div class="k">출퇴근(도로 기준, 막힘 미반영): ${w.commute}</div><div class="k">경매(2025~): ${w.auction}</div></div>`))).addTo(map);
 const lg=L.control({position:'bottomleft'});
 lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=Object.values(D.cats).map(c=>`<span class="dot" style="background:${c.color}"></span> ${c.name}`).join('<br>')+'<br><span class="dot" style="background:#7c3aed;border-radius:2px"></span> 관심 지역<br><span style="color:#6b7280">점선 원 = 대략 범위 · 핀 크기 = 소식 수</span>';return d};
 lg.addTo(map);
 chips();fit();
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.tab=t.dataset.t;render()});
 document.getElementById('freset').onclick=()=>{state.site=null;map.closePopup();fit();render()};
 render();
}
function popup(s){
 const ns=D.news.filter(x=>x.site===s.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
 const i=STAGES.indexOf(s.stage);
 return `<div class="pop"><h3>${s.name}</h3><div style="color:#6b7280;font-size:11.5px">${s.region} · ${s.place}</div>
 <div class="stage">${STAGES.map((x,j)=>`<span class="${j<=i?'f':''}"></span>`).join('')}</div><div class="stg">진행 단계: <b>${s.stage}</b> (${STAGES.join('→')})</div>
 <div class="k">${s.key}</div>${ns.length?'<ul>'+ns.map(n=>`<li>${n.date.slice(5).replace('-','/')} ${n.title}</li>`).join('')+'</ul>':''}</div>`;
}
function chips(){
 const rc=document.getElementById('regionChips');
 rc.innerHTML=['전체','용인','평택'].map(r=>`<div class="chip" data-r="${r}">${r}</div>`).join('');
 rc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.region=c.dataset.r;state.site=null;fit();render()});
 const cc=document.getElementById('catChips');
 cc.innerHTML=Object.entries(D.cats).map(([k,c])=>`<div class="chip" data-c="${k}"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`).join('');
 cc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const k=c.dataset.c;state.cats.has(k)?state.cats.delete(k):state.cats.add(k);if(!state.cats.size)state.cats.add(k);render()});
 const ec=document.getElementById('etcChips');
 ec.innerHTML=`<div class="chip" data-d="7">최근 7일</div><div class="chip" data-d="30">최근 30일</div><div class="chip" data-d="0">전체 기간</div><div class="chip" data-w="1">관심 지역 표시</div>`;
 ec.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{state.days=+c.dataset.d;render()});
 ec.querySelector('[data-w]').onclick=()=>{state.watch=!state.watch;state.watch?watchLayer.addTo(map):map.removeLayer(watchLayer);render()};
}
function fit(){
 const ss=D.sites.filter(s=>state.region==='전체'||s.region===state.region);
 map.fitBounds(L.latLngBounds(ss.map(s=>[s.lat,s.lng])).pad(.12));
}
function visNews(){
 return D.news.filter(n=>{const s=site(n.site);
  return (state.region==='전체'||s.region===state.region)&&state.cats.has(n.cat)&&(!state.site||n.site===state.site)&&(!state.days||daysAgo(n.date)<=state.days)})
 .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}
function render(){
 document.querySelectorAll('#regionChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.r===state.region));
 document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.toggle('on',state.cats.has(c.dataset.c)));
 document.querySelectorAll('#etcChips [data-d]').forEach(c=>c.classList.toggle('on',+c.dataset.d===state.days));
 document.querySelector('#etcChips [data-w]').classList.toggle('on',state.watch);
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===state.tab));
 const fb=document.getElementById('fbar');
 if(state.site){fb.style.display='flex';document.getElementById('fname').textContent='선택: '+site(state.site).name+' 소식만 보는 중'}else fb.style.display='none';
 // markers visibility
 D.sites.forEach(s=>{const show=(state.region==='전체'||s.region===state.region)&&(state.cats.has(s.cat)||D.news.some(n=>n.site===s.id&&state.cats.has(n.cat)));
  const m=markers[s.id];show?m.addTo(map):map.removeLayer(m);if(circles[s.id])show?circles[s.id].addTo(map):map.removeLayer(circles[s.id]);
  m.setStyle({weight:state.site===s.id?4:2,color:state.site===s.id?'#111827':'#fff'})});
 const L_=document.getElementById('list');
 if(state.tab==='news'){
  const ns=visNews();
  L_.innerHTML=ns.length?ns.map(n=>{const s=site(n.site),c=D.cats[n.cat];const fresh=daysAgo(n.date)<=7;
   return `<div class="item" data-s="${n.site}"><div class="meta"><span class="badge" style="background:${c.color}">${c.name}</span>${fresh?'<span class="badge new">NEW</span>':''}<span>${n.date}</span><span>· ${s.region} ${s.name.replace(/ \(.*\)/,'')}</span></div>
   <div class="ttl">${n.title}</div><div class="sum">${n.summary}</div><div class="src"><a href="${n.url}" target="_blank" rel="noopener">${n.src} ↗</a></div></div>`}).join(''):'<div class="empty">조건에 맞는 소식 없음</div>';
 }else if(state.tab==='sites'){
  const ss=D.sites.filter(s=>(state.region==='전체'||s.region===state.region)&&state.cats.has(s.cat));
  L_.innerHTML=ss.map(s=>{const i=STAGES.indexOf(s.stage),n=D.news.filter(x=>x.site===s.id).length;
   return `<div class="sitecard" data-s="${s.id}"><div class="meta"><span class="badge" style="background:${D.cats[s.cat].color}">${D.cats[s.cat].name}</span><span>${s.region} · ${s.place}</span></div>
   <div class="ttl">${s.name}</div><div class="sum">${s.key}</div><div class="stage">${STAGES.map((x,j)=>`<span class="${j<=i?'f':''}"></span>`).join('')}</div><div class="stg">단계 ${s.stage} · 소식 ${n}건</div></div>`}).join('');
 }else{
  const ms=D.milestones.filter(m=>{const s=site(m.site);return (state.region==='전체'||s.region===state.region)&&(!state.site||m.site===state.site)});
  L_.innerHTML=ms.map(m=>{const s=site(m.site);return `<div class="ms" data-s="${m.site}"><b>${m.when}</b><div><span class="dot" style="background:${D.cats[s.cat].color}"></span> ${m.text}<div class="stg">${s.region} · ${s.name}</div></div></div>`}).join('')+'<div class="empty" style="padding:14px">목표 일정은 발표 기준. 대형 사업은 대개 밀림.</div>';
 }
 L_.querySelectorAll('[data-s]').forEach(el=>el.onclick=e=>{if(e.target.tagName==='A')return;const s=site(el.dataset.s);
  map.flyTo([s.lat,s.lng],13,{duration:.6});setTimeout(()=>markers[s.id].openPopup(),650);
  if(state.tab!=='news'){state.site=s.id;state.tab='news';render()}else{L_.querySelectorAll('.item').forEach(i=>i.classList.toggle('sel',i===el))}});
}
</script>
</body>
</html>
