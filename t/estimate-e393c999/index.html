<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>견적서 - </title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#111;font-size:12.5px}
.bar{max-width:820px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button{padding:6px 11px;border:1px solid #bbb;background:#fff;color:#111;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
.bar button:hover,.bar a.btn:hover{border-color:#333}
.bar a.btn{padding:6px 11px;border:1px solid #bbb;background:#fff;color:#111;border-radius:6px;cursor:pointer;font-size:12px;text-decoration:none}
.bar a.btn.main{background:#111;color:#fff;border-color:#111}
.bar .saved{font-size:11.5px;color:#2a7}
.bar .hint{font-size:11.5px;color:#888;margin-right:auto}
.sheet{max-width:820px;margin:0 auto;background:#fff;color:#111;padding:28px 26px;border:1px solid #ddd;border-radius:4px}
h1{text-align:center;letter-spacing:16px;font-size:28px;margin:0 0 6px;padding-bottom:8px;border-bottom:3px double #111}
.top{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.top .l{flex:1 1 260px}
.top .l p{margin:4px 0;font-size:13px}
.top .l .to{font-size:17px;font-weight:700;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:10px}
table{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #000;border-left:1px solid #000}
.sup{flex:1 1 320px}
.sup td,.sup th{border:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:5px 6px;font-size:12px}
.sup th{background:#f1f1f1;font-weight:600;white-space:nowrap}
.sup .v{width:24px;text-align:center;line-height:1.6}
.total{display:flex;border:2px solid #111;margin:8px 0 14px}
.total div{padding:10px 12px;font-size:15px}
.total .k{background:#f1f1f1;font-weight:700;border-right:1px solid #111;white-space:nowrap}
.total .n{flex:1;font-weight:700}
.items th,.items td{border:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:6px 6px;font-size:12px}
.noc{position:relative}
.items th{background:#f1f1f1}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.c{text-align:center}
.items tr.sub td.nm{padding-left:20px;color:#333}
.items tr.grp td{background:#fafafa;font-weight:600}
.items tr.sum td{background:#f1f1f1;font-weight:700}
.items tr.grand td{background:#e6e6e6;font-weight:800;font-size:13px}
.note{margin-top:12px;font-size:11.5px;line-height:1.7;border:1px solid #111;padding:8px 10px}
/* 편집 */
[data-ed]{cursor:text;border-radius:2px;min-width:14px;display:inline-block;outline:0}
[data-ed]:hover,.ed:hover{background:#fff6cc}
[data-ed]:focus,.ed:focus{background:#fff1a8;box-shadow:0 0 0 2px #f2c200}
.ed{cursor:text;outline:0}
.chg{background:#e8f4ff}
.ctl{position:absolute;left:-52px;top:50%;transform:translateY(-50%);display:flex;opacity:0;gap:2px;transition:opacity .1s}
tr:hover .ctl,.ctl:focus-within{opacity:1}
.ctl b{width:20px;height:20px;line-height:18px;text-align:center;border:1px solid #bbb;border-radius:4px;background:#fff;cursor:pointer;font-weight:400;font-size:13px;color:#333}
.ctl b:hover{border-color:#333}
.wrap{padding-left:46px}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
#xmenu{display:none;position:absolute;right:0;top:34px;z-index:20;background:#fff;border:1px solid #bbb;border-radius:8px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);flex-direction:column;min-width:150px}
#xmenu.on{display:flex}
#xmenu button{border:0;text-align:left;padding:8px 10px;border-radius:5px;background:#fff}
#xmenu button:hover{background:#f2f2f2}
.bar{position:relative}
body.exporting .bar,body.exporting .ctl,body.exporting .toast{display:none!important}
body.exporting .sheet{width:794px;max-width:none;border:0;border-radius:0;padding:53px 49px;margin:0}
body.exporting .wrap{padding:0}
body.exporting [data-ed],body.exporting .ed,body.exporting .chg{background:none!important;box-shadow:none!important}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{html,body{margin:0}table{border:0}.items th,.items td,.sup td,.sup th{border:.16mm solid #000}.items tr,.sup tr{break-inside:avoid}.bar,.ctl,.toast{display:none!important}.sheet{border:0;border-radius:0;padding:14mm 13mm;max-width:none;margin:0}.wrap{padding:0}[data-ed]:hover,.ed:hover,.chg{background:none}}
</style></head><body>
<div class="wrap">
<div class="bar">
 <span class="hint">눌러서 수정 · Enter 확정 · 다 고치면 검은 버튼을 눌러야 저장돼요</span>
 <button id="bAdd">＋ 항목</button>
 <button id="bUndo">되돌리기</button>
 <button id="bReset">원본으로</button>

 <button id="bLink" style="display:none">링크 복사</button>

</div>
<div class="sheet" id="sheet">
<h1 class="ed" contenteditable data-h="doc">견 적 서</h1>
<div class="top">
 <div class="l">
  <p class="to"><span class="ed" contenteditable data-h="to"></span></p>
  <p>견 적 일 : <span class="ed" contenteditable data-h="date"></span></p>
  <p>공 사 명 : <b class="ed" contenteditable data-h="title"></b></p>
  <p>공사장소 : <span class="ed" contenteditable data-h="place"></span></p>
  <p>유효기간 : <span class="ed" contenteditable data-h="valid"></span></p>
  <p style="margin-top:12px">아래와 같이 견적합니다.</p>
 </div>
 <table class="sup">
  <tr><th class="v" rowspan="5">공<br>급<br>자</th><th>등록번호</th><td colspan="3" class="ed" contenteditable data-h="regno"></td></tr>
  <tr><th>상 호</th><td class="ed" contenteditable data-h="co"></td><th>대표</th><td class="ed" contenteditable data-h="ceo"></td></tr>
  <tr><th>주 소</th><td colspan="3" class="ed" contenteditable data-h="addr"></td></tr>
  <tr><th>업 태</th><td class="ed" contenteditable data-h="biz"></td><th>종목</th><td class="ed" contenteditable data-h="item"></td></tr>
  <tr><th>연락처</th><td colspan="3" class="ed" contenteditable data-h="tel"></td></tr>
 </table>
</div>
<div class="total"><div class="k" id="tkl">합계금액 (VAT 포함)</div><div class="n" id="tk"></div></div>
<table class="items">
<thead><tr><th style="width:34px">No</th><th>품명 / 내용</th><th style="width:44px">단위</th><th style="width:56px">수량</th><th style="width:88px">단가</th><th style="width:96px">금액</th><th style="width:76px">비고</th></tr></thead>

</table>

</div>
</div>

<script id="init" type="application/json">{
 "id": "blank",
 "profitLabel": "기업이윤",
 "rate": 15,
 "vat": 10,
 "h": {
  "doc": "견 적 서"
 },
 "rows": [
  {
   "t": "item",
   "n": "새 항목",
   "u": "식",
   "q": 1,
   "p": 0,
   "b": ""
  }
 ]
}</script>
<script>
const INIT=JSON.parse(document.getElementById('init').textContent);
const PRINT_URL='https://www.woostudio.co.kr/t/estimate-e393c999/';
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>JSON.parse(decodeURIComponent(escape(atob(t))));
let HS=null,AUTOPRINT=false;
try{const m=location.hash.match(/[#&]d=([^&]+)/);if(m){HS=dec(decodeURIComponent(m[1]));AUTOPRINT=/[#&]p=1/.test(location.hash)}}catch(e){}
if(HS&&HS.init){Object.assign(INIT,HS.init)}
const KEY='est_'+(INIT.id||'doc');
const ORIG=JSON.stringify(INIT);
let S, hist=[];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LS=null;try{LS=JSON.parse(ls.get(KEY))}catch(e){}
if(HS&&HS.s){S=(LS&&LS.rows&&(LS.ts||0)>(HS.s.ts||0))?LS:HS.s}else{S=LS}
if(!S||!S.rows) S=JSON.parse(ORIG);
S.h=S.h||{};
const H0=INIT.h||{};
if(H0.title)document.title='견적서 - '+H0.title.replace(/<[^>]+>/g,'');
const base=r=>({n:r.n,u:r.u,q:r.q,p:r.p,b:r.b});
S.rows.forEach(r=>{if(!r._o)r._o=base(r)});
const W=x=>Math.round(x).toLocaleString('ko-KR');
const P=s=>{const v=parseFloat(String(s).replace(/[^0-9.\-]/g,''));return isNaN(v)?0:v};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const o=JSON.parse(ORIG);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1300)}
function save(){S.ts=Date.now();ls.set(KEY,JSON.stringify(S));const st=document.getElementById('saved');if(st){const d=new Date();st.textContent='자동 저장됨 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};if(HS){try{history.replaceState(null,'','#d='+encodeURIComponent(enc({init:INIT,s:S})))}catch(e){}}}
function push(){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift()}
function ed(i,k,v,cls=''){
 const or=S.rows[i]._o; const ch=or&&String(or[k]??'')!==String(S.rows[i][k]??'')?' chg':'';
 return `<span data-ed data-i="${i}" data-k="${k}" contenteditable class="${cls}${ch}">${v}</span>`;
}
const ctl=i=>`<span class="ctl"><b data-add="${i}" title="아래에 줄 추가">＋</b><b data-del="${i}" title="이 줄 삭제">×</b></span>`;
function render(){
 let h='',direct=0,no=0,exs=[],gi=null,gsum={};
 S.rows.forEach((r,i)=>{ if(r.t==='grp'){gi=i;gsum[i]=0} else if(r.t==='sub'&&gi!==null) gsum[gi]+=r.q*r.p; else if(r.t!=='sub') gi=null; });
 S.rows.forEach((r,i)=>{
  if(r.t==='ex'){exs.push(i);return}
  if(r.t==='grp'){no++;h+=`<tr class="grp"><td class="c"><div class="noc">${ctl(i)}${no}</div></td><td>${ed(i,'n',esc(r.n))}</td><td></td><td></td><td></td><td class="num">${W(gsum[i]||0)}</td><td>${ed(i,'b',esc(r.b))}</td></tr>`;return}
  const a=r.q*r.p; direct+=a; if(r.t!=='sub')no++;
  h+=`<tr class="${r.t==='sub'?'sub':''}"><td class="c"><div class="noc">${ctl(i)}${r.t==='sub'?'':no}</div></td><td class="nm">${r.t==='sub'?'· ':''}${ed(i,'n',esc(r.n))}</td><td class="c">${ed(i,'u',esc(r.u))}</td><td class="num">${ed(i,'q',W(r.q))}</td><td class="num">${ed(i,'p',W(r.p))}</td><td class="num">${W(a)}</td><td class="c">${ed(i,'b',esc(r.b))}</td></tr>`;
 });
 const profit=S.rate==null?0:Math.round(direct*S.rate/100);
 h+=`<tr class="sum"><td></td><td>직접공사비 소계</td><td></td><td></td><td></td><td class="num">${W(direct)}</td><td></td></tr>`;
 if(S.rate!=null)no++;
 if(S.rate!=null)h+=`<tr><td class="c">${no}</td><td>${INIT.profitLabel||'기업이윤'} (직접공사비 × <span data-ed data-s="rate" contenteditable class="${S.rate!=o.rate?'chg':''}">${S.rate}</span>%)</td><td class="c">%</td><td class="num">${S.rate}</td><td></td><td class="num">${W(profit)}</td><td></td></tr>`;
 let exSum=0;
 exs.forEach(i=>{const r=S.rows[i],a=r.q*r.p;exSum+=a;no++;
  h+=`<tr><td class="c"><div class="noc">${ctl(i)}${no}</div></td><td>${ed(i,'n',esc(r.n))}</td><td class="c">${ed(i,'u',esc(r.u))}</td><td class="num">${ed(i,'q',W(r.q))}</td><td class="num">${ed(i,'p',W(r.p))}</td><td class="num">${W(a)}</td><td class="c">${ed(i,'b',esc(r.b))}</td></tr>`});
 const supply=direct+profit+exSum, vat=S.vat==null?0:Math.round(supply*S.vat/100), total=supply+vat;
 h+=`<tr class="sum"><td></td><td>공급가액</td><td></td><td></td><td></td><td class="num">${W(supply)}</td><td></td></tr>
 ${S.vat==null?'':`<tr><td></td><td>부가가치세 (<span data-ed data-s="vat" contenteditable class="${S.vat!=o.vat?'chg':''}">${S.vat}</span>%)</td><td></td><td></td><td></td><td class="num">${W(vat)}</td><td></td></tr>`}
 <tr class="grand"><td></td><td>합 계</td><td></td><td></td><td></td><td class="num">${W(total)}</td><td></td></tr>`;
 document.getElementById('tb').innerHTML=h;
 document.getElementById('tkl').textContent=S.vat==null?'합계금액':'합계금액 (VAT 포함)';
 document.getElementById('tk').textContent=`일금 ${kor(total)}원정 ( ₩${W(total)} )`;
}
function kor(n){if(!n)return'영';const d=['','일','이','삼','사','오','육','칠','팔','구'],u=['','십','백','천'],b=['','만','억','조'];let s='',i=0;while(n>0){const c=n%10000;if(c){let t='';String(c).padStart(4,'0').split('').forEach((x,j)=>{if(+x)t+=d[+x]+u[3-j]});s=t+b[i]+s}n=Math.floor(n/10000);i++}return s}
const tb=document.getElementById('tb');
function commit(el){
 const v=el.textContent.trim();
 if(el.dataset.s){const nv=P(v);if(nv!==S[el.dataset.s]){push();S[el.dataset.s]=nv;save();render()}return}
 const i=+el.dataset.i,k=el.dataset.k,r=S.rows[i];if(!r)return;
 const nv=(k==='q'||k==='p')?P(v):v;
 if(String(nv)!==String(r[k]??'')){push();r[k]=nv;save();render();toast('수정됨')}else if(k==='q'||k==='p')el.textContent=W(r[k]);
}
tb.addEventListener('focusout',e=>{if(e.target.matches('[data-ed]'))commit(e.target)});
document.addEventListener('keydown',e=>{
 const el=e.target;
 if(el.matches&&el.matches('[data-ed]')&&e.key==='Enter'){e.preventDefault();el.blur()}
 if(el.matches&&el.matches('[data-ed]')&&e.key==='Escape'){render()}
 if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!(el.isContentEditable)){e.preventDefault();undo()}
});
tb.addEventListener('focusin',e=>{const el=e.target;if(el.matches('[data-ed]')){const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(el);sel.removeAllRanges();sel.addRange(rg)}});
tb.addEventListener('click',e=>{
 const a=e.target.dataset.add,d=e.target.dataset.del;
 if(a!==undefined){push();const r=S.rows[+a];const t=r.t==='grp'||r.t==='sub'?'sub':(r.t==='ex'?'ex':'item');S.rows.splice(+a+1,0,{t,n:'새 항목',u:'식',q:1,p:0,b:'',_o:{}});save();render();
  const el=tb.querySelector(`[data-i="${+a+1}"][data-k="n"]`);el&&el.focus()}
 if(d!==undefined){push();S.rows.splice(+d,1);save();render();toast('삭제됨 · 되돌리기 가능')}
});
// 머리말·특기사항
document.querySelectorAll('[data-h]').forEach(el=>{
 const k=el.dataset.h;
 if(k==='date'&&!S.h.date){const d=new Date();el.textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
 if(H0[k]!=null&&!(k==='date'&&!H0.date))el.innerHTML=H0[k];
 if(S.h[k]!=null)el.innerHTML=S.h[k];
 el.addEventListener('blur',()=>{if(S.h[k]!==el.innerHTML){S.h[k]=el.innerHTML;save()}});
});
function undo(){if(!hist.length){toast('되돌릴 게 없음');return}S=JSON.parse(hist.pop());save();render();toast('되돌림')}
document.getElementById('bUndo').onclick=undo;
document.getElementById('bAdd').onclick=()=>{push();const idx=S.rows.findIndex(r=>r.t==='ex');const at=idx<0?S.rows.length:idx;S.rows.splice(at,0,{t:'item',n:'새 항목',u:'식',q:1,p:0,b:'',_o:{}});save();render();const el=tb.querySelector(`[data-i="${at}"][data-k="n"]`);el&&el.focus()};
document.getElementById('bReset').onclick=()=>{push();S=JSON.parse(ORIG);S.h={};S.rows.forEach(r=>r._o=base(r));document.querySelectorAll('[data-h]').forEach(el=>{if(H0[el.dataset.h]!=null)el.innerHTML=H0[el.dataset.h]});save();render();toast('원본으로 돌림 · 되돌리기 가능')};
const FRAMED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const sv=document.getElementById('bSave');
const setSaveHref=()=>{sv.href=PRINT_URL+'?v='+Date.now()+'#d='+encodeURIComponent(enc(snap()))};
sv.addEventListener('mousedown',()=>{if(FRAMED)setSaveHref()});
sv.addEventListener('click',e=>{if(FRAMED){setSaveHref();toast('새 탭에서 열려요. 거기서 고치면 자동 저장돼요');return}e.preventDefault();document.getElementById('xmenu').classList.toggle('on')});
if(!FRAMED){for(const el of [sv,document.getElementById('bPrint')]){el.removeAttribute('target');el.removeAttribute('href');el.setAttribute('role','button')}sv.textContent='파일로 저장 ▾';sv.classList.remove('main');document.querySelector('.bar .hint').textContent='고치면 이 브라우저에 자동 저장돼요 · 같은 링크로 다시 열면 이어서 · 링크 복사 → Aside에 붙이면 반영';const bl=document.getElementById('bLink');bl.style.display='';bl.onclick=async()=>{const u=PRINT_URL+'?v='+Date.now()+'#d='+encodeURIComponent(enc(snap()));try{await navigator.clipboard.writeText(u);toast('링크 복사됨 · Aside 채팅에 붙여 넣으면 그대로 반영')}catch(e){prompt('이 주소를 복사해서 Aside에 붙여 넣으세요',u)}}}
function doSave(){
 document.querySelectorAll('[data-h]').forEach(el=>S.h[el.dataset.h]=el.innerHTML);
 const clone=document.documentElement.cloneNode(true);
 const st=Object.assign({},INIT,{id:(INIT.id||'doc')+'_'+Date.now(),rate:S.rate,vat:S.vat,rows:S.rows.map(({_o,...r})=>r),h:Object.assign({},H0,S.h)});
 clone.querySelector('#init').textContent=JSON.stringify(st);
 clone.querySelectorAll('[data-h]').forEach(el=>el.innerHTML=S.h[el.dataset.h]??el.innerHTML);
 clone.querySelector('#tb').innerHTML='';
 const html='<!doctype html>\n'+clone.outerHTML;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='견적서_수정본.html';document.body.appendChild(a);a.click();a.remove();toast('수정본 파일 저장됨 (다운로드 폴더)');
}
function snap(){document.querySelectorAll('[data-h]').forEach(el=>S.h[el.dataset.h]=el.innerHTML);return {init:INIT,s:S}}
const pa=document.getElementById('bPrint');
pa.addEventListener('mousedown',()=>{pa.href=PRINT_URL+'?v='+Date.now()+'#d='+encodeURIComponent(enc(snap()))+'&p=1'});
pa.addEventListener('click',e=>{let framed=false;try{framed=window.self!==window.top}catch(x){framed=true}
 if(!framed){e.preventDefault();window.print();return}
 pa.href=PRINT_URL+'?v='+Date.now()+'#d='+encodeURIComponent(enc(snap()))+'&p=1';toast('새 탭에서 인쇄 창이 열려요')});
// ===== 파일로 내보내기 (PDF · JPG · 한글 · HTML) =====
const LIBS={h2c:'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',pdf:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',zip:'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'};
function loadJS(u){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${u}"]`)){ok();return}const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('라이브러리 로드 실패'));document.head.appendChild(s)})}
function fname(ext){const t=(document.querySelector('[data-h="title"]').textContent||'견적서').replace(/[\\/:*?"<>|]/g,'').trim();const d=new Date();return `견적서_${t}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.${ext}`}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function sheetCanvas(){
 await loadJS(LIBS.h2c);
 document.body.classList.add('exporting');
 try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  return await html2canvas(document.getElementById('sheet'),{scale:2.5,backgroundColor:'#ffffff',useCORS:true});
 } finally { document.body.classList.remove('exporting') }
}
async function exportJPG(){const c=await sheetCanvas();c.toBlob(b=>dl(b,fname('jpg')),'image/jpeg',0.95)}
async function exportPDF(){
 const c=await sheetCanvas(); await loadJS(LIBS.pdf);
 const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
 const pw=210,ph=297; const ih=c.height*pw/c.width;
 const img=c.toDataURL('image/jpeg',0.95);
 if(ih<=ph){pdf.addImage(img,'JPEG',0,0,pw,ih)}
 else{ // 여러 쪽
  const pagePx=Math.floor(c.width*ph/pw); let y=0,first=true;
  while(y<c.height){const h=Math.min(pagePx,c.height-y);const pc=document.createElement('canvas');pc.width=c.width;pc.height=h;const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,h);cx.drawImage(c,0,y,c.width,h,0,0,c.width,h);
   if(!first)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',0,0,pw,h*pw/c.width);first=false;y+=h}
 }
 dl(pdf.output('blob'),fname('pdf'));
}
// --- 한글(.hwpx) ---
const HX=PRINT_URL+'hwpx/';
const xe=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const strip=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<br\s*\/?>/gi,'\n');return d.textContent.trim()};
const MM=283.465, TW=42520; let _hid=1000;
function hpara(text,cpr=7,ppr=17){const parts=String(text).split('\n');const t=parts.map((p,k)=>k===0?`<hp:t>${xe(p)}</hp:t>`:`<hp:t><hp:lineBreak/>${xe(p)}</hp:t>`).join('');return `<hp:p id="0" paraPrIDRef="${ppr}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${cpr}">${t}</hp:run></hp:p>`}
function hcell(col,row,w,h,paras,bf=3,cs=1,rs=1,va='CENTER'){return `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${va}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras.join('')}</hp:subList><hp:cellAddr colAddr="${col}" rowAddr="${row}"/><hp:cellSpan colSpan="${cs}" rowSpan="${rs}"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="425" right="425" top="141" bottom="141"/></hp:tc>`}
function htable(trs,nc,nr,w,h,bf=3){return `<hp:tbl id="${++_hid}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${nr}" colCnt="${nc}" cellSpacing="0" borderFillIDRef="${bf}" noAdjust="0"><hp:sz width="${w}" widthRelTo="ABSOLUTE" height="${h}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="283"/><hp:inMargin left="425" right="425" top="141" bottom="141"/>${trs.join('')}</hp:tbl>`}
const tpara=t=>`<hp:p id="0" paraPrIDRef="17" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="7">${t}<hp:t/></hp:run></hp:p>`;
async function exportHWP(){
 await loadJS(LIBS.zip);
 const names=['header.xml','sec_head.xml','secpr.xml','version.xml','settings.xml','content.hpf','container.xml','manifest.xml'];
 const F={};await Promise.all(names.map(async n=>{const r=await fetch(HX+n);if(!r.ok)throw new Error(n+' 못 받음');F[n]=await r.text()}));
 const sn=snap(); const h=Object.assign({},H0,sn.s.h); const rows=S.rows, rate=S.rate, vat=S.vat;
 let direct=0,ex=0;rows.forEach(r=>{if(r.t==='item'||r.t==='sub')direct+=r.q*r.p;if(r.t==='ex')ex+=r.q*r.p});
 const profit=rate==null?0:Math.round(direct*rate/100), supply=direct+profit+ex, vv=vat==null?0:Math.round(supply*vat/100), total=supply+vv;
 const out=[];
 const title=htable(['<hp:tr>'+hcell(0,0,TW,3400,[hpara(strip(h.doc||'견적서').replace(/\s/g,'').split('').join(' '),9,20)],7)+'</hp:tr>'],1,1,TW,3400,7);
 out.push(`<hp:p id="0" paraPrIDRef="17" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="7">${F['secpr.xml']}<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl>${title}<hp:t/></hp:run></hp:p>`);
 const cw=[18,54,8,18].map(x=>Math.round(x*MM));cw.push(TW-cw.reduce((a,b)=>a+b,0));const rh=Math.round(7.2*MM);
 const dateTxt=strip(document.querySelector('[data-h="date"]').innerHTML);
 const L=[['수 신',strip(h.to)],['견 적 일',dateTxt],['공 사 명',strip(h.title)],['공사장소',strip(h.place)],['유효기간',strip(h.valid)]];
 const R=[['등록번호',strip(h.regno)],['상호 / 대표',`${strip(h.co)}  /  ${strip(h.ceo)}`],['주 소',strip(h.addr)],['업태 / 종목',[strip(h.biz),strip(h.item)].filter(Boolean).join(' / ')],['연 락 처',strip(h.tel)]];
 let trs=[];for(let i=0;i<5;i++){let c=hcell(0,i,cw[0],rh,[hpara(L[i][0],8,18)],4)+hcell(1,i,cw[1],rh,[hpara(L[i][1],i===2?8:7,17)]);if(i===0)c+=hcell(2,0,cw[2],rh*5,[hpara('공\n급\n자',8,18)],4,1,5);c+=hcell(3,i,cw[3],rh,[hpara(R[i][0],8,18)],4)+hcell(4,i,cw[4],rh,[hpara(R[i][1],7,17)]);trs.push('<hp:tr>'+c+'</hp:tr>')}
 out.push(tpara(htable(trs,5,5,TW,rh*5)));
 const kw=Math.round(40*MM),th=Math.round(10*MM);
 out.push(tpara(htable(['<hp:tr>'+hcell(0,0,kw,th,[hpara(vat==null?'합계금액':'합계금액 (VAT 포함)',11,18)],8)+hcell(1,0,TW-kw,th,[hpara(`일금 ${kor(total)}원정  ( ₩${W(total)} )`,11,17)],6)+'</hp:tr>'],2,1,TW,th,6)));
 const ws=[9,55,11,12,20,22,21].map(x=>Math.round(x*MM));ws[1]+=TW-ws.reduce((a,b)=>a+b,0);const rh2=Math.round(6.6*MM);
 trs=[];const C=18,Lf=17,Rt=19;
 const row=(vals,cp,pp,bf=3)=>{const r=trs.length;return '<hp:tr>'+vals.map((v,k)=>hcell(k,r,ws[k],rh2,[hpara(v,cp[k],pp[k])],bf)).join('')+'</hp:tr>'};
 const A7=a=>Array(7).fill(a), al=[C,Lf,C,Rt,Rt,Rt,C];
 trs.push(row(['No','품명 / 내용','단위','수량','단가','금액','비고'],A7(8),A7(C),4));
 let no=0,gi=null;const gs={};rows.forEach((r,i)=>{if(r.t==='grp'){gi=i;gs[i]=0}else if(r.t==='sub'&&gi!==null)gs[gi]+=r.q*r.p;else if(r.t!=='sub')gi=null});
 rows.forEach((r,i)=>{if(r.t==='ex')return;if(r.t==='grp'){no++;trs.push(row([String(no),r.n,'','','',W(gs[i]||0),r.b||''],A7(8),al));return}
  if(r.t!=='sub')no++;trs.push(row([r.t==='sub'?'':String(no),(r.t==='sub'?'   · ':'')+r.n,r.u||'',W(r.q),W(r.p),W(r.q*r.p),r.b||''],A7(7),al))});
 trs.push(row(['','직접공사비 소계','','','',W(direct),''],A7(8),al,4));
 if(rate!=null){no++;trs.push(row([String(no),`${INIT.profitLabel||'기업이윤'} (직접공사비 × ${rate}%)`,'%',String(rate),'',W(profit),''],A7(7),al))}
 rows.filter(r=>r.t==='ex').forEach(r=>{no++;trs.push(row([String(no),r.n,r.u||'',W(r.q),W(r.p),W(r.q*r.p),r.b||''],A7(7),al))});
 trs.push(row(['','공급가액','','','',W(supply),''],A7(8),al,4));
 if(vat!=null)trs.push(row(['',`부가가치세 (${vat}%)`,'','','',W(vv),''],A7(7),al));
 trs.push(row(['','합    계','','','',W(total),''],A7(8),al,5));
 out.push(tpara(htable(trs,7,trs.length,TW,rh2*trs.length)));
 const note=strip(document.querySelector('[data-h="note"]').innerHTML);
 if(note){const ps=note.split('\n').map(l=>hpara(l,7,17));const nh=Math.round((ps.length*5+4)*MM);out.push(tpara(htable(['<hp:tr>'+hcell(0,0,TW,nh,ps,3,1,1,'TOP')+'</hp:tr>'],1,1,TW,nh)))}
 out.push(hpara('위와 같이 견적합니다.',10,19));
 const sec=F['sec_head.xml']+out.join('')+'</hs:sec>';
 const z=new JSZip();
 z.file('mimetype','application/hwp+zip',{compression:'STORE'});
 z.file('version.xml',F['version.xml']);z.file('Contents/header.xml',F['header.xml']);z.file('Contents/section0.xml',sec);
 z.file('Preview/PrvText.txt',`견적서 ${strip(h.title)} 합계 ${W(total)}원`);z.file('settings.xml',F['settings.xml']);
 z.file('META-INF/container.xml',F['container.xml']);z.file('Contents/content.hpf',F['content.hpf']);z.file('META-INF/manifest.xml',F['manifest.xml']);
 const blob=await z.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/hwp+zip'});
 dl(blob,fname('hwpx'));
}
// 메뉴
(function(){const m=document.createElement('div');m.id='xmenu';m.innerHTML='<button data-x="pdf">PDF</button><button data-x="jpg">JPG 이미지</button><button data-x="hwp">한글 (HWPX)</button><button data-x="html">HTML</button>';document.querySelector('.bar').appendChild(m);
 m.addEventListener('click',async e=>{const x=e.target.dataset.x;if(!x)return;m.classList.remove('on');toast('만드는 중…');
  try{if(x==='pdf')await exportPDF();else if(x==='jpg')await exportJPG();else if(x==='hwp')await exportHWP();else doSave();toast('저장됨 (다운로드 폴더)')}catch(err){toast('실패: '+err.message)}});
 document.addEventListener('click',e=>{if(!e.target.closest('#xmenu')&&e.target.id!=='bSave')m.classList.remove('on')});
})();

if(AUTOPRINT){setTimeout(()=>window.print(),600)}
render();
</script></body></html>
